<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON://SNAKE</title>
<style>
/* ============================================================
   THEME TOKENS
   ============================================================ */
:root {
  --bg:        #030805;
  --green:     #00ff66;
  --green-dim: #00a844;
  --cyan:      #00e5ff;
  --magenta:   #ff00c8;
  --font:      'Share Tech Mono', 'OCR A Extended', 'Lucida Console', 'Courier New', monospace;
  --board:     480px;           /* overwritten by JS to match the canvas size */
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--green);
  font-family: var(--font);
  overflow: hidden;
  user-select: none;
}

/* ============================================================
   BACKGROUND LAYERS: digital rain, scanlines, vignette
   ============================================================ */
#rain {
  position: fixed;
  inset: 0;
  z-index: 0;
  opacity: 0.55;
}

/* Static CRT scanlines + a slow sweeping band of light */
.scanlines {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.28) 0px,
    rgba(0, 0, 0, 0.28) 1px,
    transparent 1px,
    transparent 3px
  );
}
.scanlines::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 140px;
  background: linear-gradient(transparent, rgba(0, 255, 102, 0.07), transparent);
  animation: sweep 8s linear infinite;
}
@keyframes sweep {
  from { top: -140px; }
  to   { top: 100%; }
}

.vignette {
  position: fixed;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.8) 100%);
}

/* ============================================================
   UI LAYOUT
   ============================================================ */
#ui {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 20px;
  animation: flicker 5s infinite;
}
/* Very subtle CRT brightness flicker */
@keyframes flicker {
  0%, 100% { opacity: 1; }
  41%      { opacity: 1; }
  42%      { opacity: 0.93; }
  43%      { opacity: 1; }
  78%      { opacity: 1; }
  79%      { opacity: 0.96; }
  80%      { opacity: 1; }
}

/* HUD row above the board */
.hud {
  width: var(--board);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
}
.hud-cell {
  display: flex;
  flex-direction: column;
  min-width: 110px;
  padding: 6px 10px;
  border: 1px solid rgba(0, 255, 102, 0.35);
  background: rgba(0, 20, 10, 0.55);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
}
.hud-cell.right { align-items: flex-end; }
.label {
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--green-dim);
}
.value {
  font-size: 22px;
  color: var(--cyan);
  text-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
}
.value.record {
  color: var(--magenta);
  text-shadow: 0 0 8px rgba(255, 0, 200, 0.8);
}

/* Status bar under the board */
.status {
  width: var(--board);
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--green-dim);
}
.status b {
  color: var(--green);
  font-weight: normal;
}
#speed { color: var(--cyan); letter-spacing: 0; }

/* ============================================================
   GLITCH TEXT
   Two colour-shifted copies of the text are sliced with clip-path
   and briefly revealed, giving an RGB-split glitch.
   ============================================================ */
.glitch {
  position: relative;
  display: inline-block;
  font-size: clamp(18px, 2.6vw, 30px);
  letter-spacing: 0.22em;
  color: var(--green);
  text-shadow: 0 0 6px var(--green), 0 0 18px rgba(0, 255, 102, 0.45);
  white-space: nowrap;
}
.glitch.big { font-size: clamp(30px, 5vw, 52px); }
.glitch::before,
.glitch::after {
  content: attr(data-text);
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  clip-path: inset(100% 0 0 0);
  pointer-events: none;
}
.glitch::before {
  color: var(--cyan);
  text-shadow: -1px 0 var(--cyan);
  animation: glitchA 3.1s infinite linear;
}
.glitch::after {
  color: var(--magenta);
  text-shadow: 1px 0 var(--magenta);
  animation: glitchB 2.3s infinite linear;
}
@keyframes glitchA {
  0%, 93%, 100% { clip-path: inset(100% 0 0 0); transform: none; }
  94%  { clip-path: inset(10% 0 70% 0); transform: translate(-4px, 0); }
  96%  { clip-path: inset(60% 0 20% 0); transform: translate(4px, 0); }
  98%  { clip-path: inset(35% 0 45% 0); transform: translate(-2px, 0); }
}
@keyframes glitchB {
  0%, 89%, 100% { clip-path: inset(100% 0 0 0); transform: none; }
  90%  { clip-path: inset(70% 0 10% 0); transform: translate(4px, 0); }
  92%  { clip-path: inset(20% 0 60% 0); transform: translate(-4px, 0); }
  95%  { clip-path: inset(45% 0 40% 0); transform: translate(2px, 0); }
}

/* ============================================================
   GAME FRAME
   ============================================================ */
.frame {
  position: relative;
  padding: 6px;
  border: 1px solid rgba(0, 255, 102, 0.55);
  background: rgba(0, 12, 6, 0.75);
  box-shadow:
    0 0 24px rgba(0, 255, 102, 0.25),
    inset 0 0 24px rgba(0, 255, 102, 0.12);
}
/* Cyan corner brackets */
.frame::before,
.frame::after {
  content: '';
  position: absolute;
  width: 22px;
  height: 22px;
  border: 2px solid var(--cyan);
  pointer-events: none;
  filter: drop-shadow(0 0 4px var(--cyan));
}
.frame::before { top: -7px; left: -7px; border-right: 0; border-bottom: 0; }
.frame::after  { bottom: -7px; right: -7px; border-left: 0; border-top: 0; }

#game {
  display: block;
  background: #020a05;
}

/* Short glitch jolt when the snake eats */
.frame.hit { animation: hit 0.18s steps(2) 1; }
@keyframes hit {
  0%   { transform: translate(3px, -2px); filter: hue-rotate(40deg) saturate(2); }
  50%  { transform: translate(-3px, 2px); filter: hue-rotate(-40deg); }
  100% { transform: none; filter: none; }
}
/* Heavier glitch on death */
.frame.dead { animation: dead 0.55s steps(4) 1; }
@keyframes dead {
  0%   { transform: translate(6px, 0) skewX(4deg);  filter: hue-rotate(120deg) contrast(1.6); }
  25%  { transform: translate(-6px, 2px);           filter: invert(0.15) hue-rotate(200deg); }
  50%  { transform: translate(4px, -3px) skewX(-3deg); filter: saturate(3); }
  75%  { transform: translate(-2px, 0);              filter: hue-rotate(60deg); }
  100% { transform: none; filter: none; }
}

/* ============================================================
   OVERLAY (start / pause / game over)
   ============================================================ */
.overlay {
  position: absolute;
  inset: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  text-align: center;
  background: rgba(1, 8, 4, 0.86);
  backdrop-filter: blur(2px);
  transition: opacity 0.2s;
}
.overlay.hidden { opacity: 0; pointer-events: none; }

/* Terminal boot log with typewriter reveal */
.boot {
  width: max-content;
  max-width: 100%;
  text-align: left;
  font-size: 12px;
  color: var(--green-dim);
  letter-spacing: 0.08em;
}
.boot .line {
  overflow: hidden;
  white-space: nowrap;
  width: 0;
  animation: type 0.45s steps(34, end) forwards;
  animation-delay: calc(var(--i) * 0.28s);
}
@keyframes type { to { width: 100%; } }

.hint {
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--green-dim);
}
.prompt {
  font-size: 14px;
  letter-spacing: 0.25em;
  color: var(--cyan);
  text-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
  animation: blink 1.1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0.25; } }

.stats {
  display: flex;
  gap: 32px;
  font-size: 13px;
  letter-spacing: 0.2em;
}
.stats span { display: block; }
.stats .value { font-size: 28px; }
.record-tag {
  color: var(--magenta);
  letter-spacing: 0.3em;
  text-shadow: 0 0 10px rgba(255, 0, 200, 0.8);
  animation: blink 0.6s steps(1) infinite;
}

/* Small screens: shrink HUD text */
@media (max-width: 520px) {
  .hud-cell { min-width: 80px; }
  .value { font-size: 18px; }
  .status { font-size: 9px; }
}
</style>
</head>
<body>

<!-- Background: Matrix digital rain -->
<canvas id="rain"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<main id="ui">
  <header class="hud">
    <div class="hud-cell">
      <span class="label">SCORE</span>
      <span id="score" class="value">00000</span>
    </div>
    <div class="glitch" data-text="NEON://SNAKE">NEON://SNAKE</div>
    <div class="hud-cell right">
      <span class="label">HIGH SCORE</span>
      <span id="high" class="value">00000</span>
    </div>
  </header>

  <div class="frame" id="frame">
    <canvas id="game"></canvas>
    <div id="overlay" class="overlay"></div>
  </div>

  <footer class="status">
    <span>LVL <b id="level">01</b></span>
    <span>SPD <b id="speed">▮▯▯▯▯▯▯▯▯▯</b></span>
    <span>[WASD / ARROWS] MOVE · [P] PAUSE</span>
  </footer>
</main>

<script>
(() => {
'use strict';

/* ============================================================
   MATRIX DIGITAL RAIN (background canvas)
   Each column tracks its own row position and fall rate. A
   translucent fill each frame leaves fading trails behind the
   bright "head" glyph.
   ============================================================ */
const rainCanvas = document.getElementById('rain');
const rctx = rainCanvas.getContext('2d');
const GLYPHS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン' +
               '0123456789ABCDEFXYZ<>/\\|{}[]=+*#$%&;:';
const RAIN_FONT = 16;
let columns = [];
let rainFrame = 0;
let lastRainT = 0;

function resizeRain() {
  rainCanvas.width = window.innerWidth;
  rainCanvas.height = window.innerHeight;
  const count = Math.ceil(rainCanvas.width / RAIN_FONT) + 1;
  columns = Array.from({ length: count }, () => ({
    y: -Math.floor(Math.random() * 60),           // start above the screen, staggered
    rate: 1 + Math.floor(Math.random() * 3)       // advance every N frames (1 = fastest)
  }));
  rctx.fillStyle = '#030805';
  rctx.fillRect(0, 0, rainCanvas.width, rainCanvas.height);
}

function drawRain(t) {
  if (t - lastRainT < 45) return;                 // ~22 fps is plenty for rain
  lastRainT = t;
  rainFrame++;

  const w = rainCanvas.width, h = rainCanvas.height;
  rctx.fillStyle = 'rgba(3, 8, 5, 0.14)';         // fade previous frame
  rctx.fillRect(0, 0, w, h);
  rctx.font = RAIN_FONT + 'px monospace';
  rctx.textBaseline = 'top';

  for (let i = 0; i < columns.length; i++) {
    const c = columns[i];
    if (rainFrame % c.rate !== 0) continue;

    const x = i * RAIN_FONT;
    const y = c.y * RAIN_FONT;

    // Re-draw the previous head in normal green, then draw the new bright head.
    rctx.fillStyle = Math.random() < 0.08 ? '#00e5ff' : '#00ff66';
    rctx.fillText(GLYPHS[Math.random() * GLYPHS.length | 0], x, y - RAIN_FONT);
    rctx.fillStyle = '#d6ffe6';
    rctx.fillText(GLYPHS[Math.random() * GLYPHS.length | 0], x, y);

    c.y++;
    // Reset the column once it runs off screen (randomly, so columns desync).
    if (y > h && Math.random() > 0.96) {
      c.y = -Math.floor(Math.random() * 20);
      c.rate = 1 + Math.floor(Math.random() * 3);
    }
  }
}

/* ============================================================
   GAME CONSTANTS
   ============================================================ */
const GRID           = 24;    // cells per side
const BASE_TICK      = 150;   // ms per move at level 1
const MIN_TICK       = 60;    // fastest allowed tick
const TICK_STEP      = 9;     // ms removed per level
const FOOD_PER_LEVEL = 4;     // pieces of food to advance one level
const HIGH_KEY       = 'neon-snake-high';

/* DOM references */
const gameCanvas = document.getElementById('game');
const gctx       = gameCanvas.getContext('2d');
const frameEl    = document.getElementById('frame');
const overlayEl  = document.getElementById('overlay');
const scoreEl    = document.getElementById('score');
const highEl     = document.getElementById('high');
const levelEl    = document.getElementById('level');
const speedEl    = document.getElementById('speed');

/* Mutable game state */
let cell = 20;                 // CSS pixels per grid cell (set by resizeGame)
let state = 'idle';            // 'idle' | 'running' | 'paused' | 'over'
let snake = [];                // array of {x, y}; index 0 is the head
let dir = { x: 1, y: 0 };      // direction applied on the last step
let inputQueue = [];           // buffered direction changes (max 3)
let food = { x: 0, y: 0 };
let score = 0;
let eaten = 0;
let highScore = loadHigh();
let newRecord = false;
let tickMs = BASE_TICK;
let acc = 0;                   // time accumulator for fixed-step updates
let lastT = 0;
let dyingUntil = 0;            // timestamp until which the death flash plays
let ripples = [];              // eat ripples: {x, y, t0}

/* ============================================================
   PERSISTENCE
   ============================================================ */
function loadHigh() {
  try {
    const v = parseInt(localStorage.getItem(HIGH_KEY), 10);
    return Number.isFinite(v) ? v : 0;
  } catch (e) { return 0; }
}
function saveHigh(v) {
  try { localStorage.setItem(HIGH_KEY, String(v)); } catch (e) { /* storage unavailable */ }
}

/* ============================================================
   SIZING (responsive, HiDPI aware)
   ============================================================ */
function resizeGame() {
  const available = Math.min(window.innerWidth - 48, window.innerHeight - 190);
  const size = Math.max(240, Math.floor(available / GRID) * GRID);
  cell = size / GRID;
  const dpr = window.devicePixelRatio || 1;

  gameCanvas.style.width  = size + 'px';
  gameCanvas.style.height = size + 'px';
  gameCanvas.width  = Math.round(size * dpr);
  gameCanvas.height = Math.round(size * dpr);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Keep HUD and status bar the same width as the board (+ frame padding).
  document.documentElement.style.setProperty('--board', (size + 14) + 'px');
}

/* ============================================================
   GAME LIFECYCLE
   ============================================================ */
function reset() {
  const mid = GRID >> 1;
  snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
  dir = { x: 1, y: 0 };
  inputQueue = [];
  score = 0;
  eaten = 0;
  newRecord = false;
  tickMs = BASE_TICK;
  acc = 0;
  ripples = [];
  spawnFood();
  updateHud();
}

function start(initialDir) {
  reset();
  if (initialDir && !(initialDir.x === -1 && initialDir.y === 0)) dir = initialDir;
  state = 'running';
  hideOverlay();
}

function pause() {
  if (state !== 'running') return;
  state = 'paused';
  showOverlay('paused');
}

function resume() {
  if (state !== 'paused') return;
  state = 'running';
  acc = 0;
  hideOverlay();
}

function die(now) {
  state = 'over';
  dyingUntil = now + 550;
  frameEl.classList.remove('dead');
  void frameEl.offsetWidth;            // restart CSS animation
  frameEl.classList.add('dead');
  if (score > highScore) {
    highScore = score;
    newRecord = true;
    saveHigh(highScore);
    updateHud();
  }
  setTimeout(() => { if (state === 'over') showOverlay('over'); }, 550);
}

/* ============================================================
   CORE STEP: advance the snake one cell
   ============================================================ */
function step(now) {
  // Consume one buffered input per step.
  if (inputQueue.length) dir = inputQueue.shift();

  const head = snake[0];
  const nx = head.x + dir.x;
  const ny = head.y + dir.y;

  // Wall collision
  if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID) { die(now); return; }

  // Self collision (the tail cell is allowed since it moves away this tick,
  // unless we are about to grow).
  const willEat = nx === food.x && ny === food.y;
  const limit = willEat ? snake.length : snake.length - 1;
  for (let i = 0; i < limit; i++) {
    if (snake[i].x === nx && snake[i].y === ny) { die(now); return; }
  }

  snake.unshift({ x: nx, y: ny });

  if (willEat) {
    eaten++;
    const level = Math.floor(eaten / FOOD_PER_LEVEL);
    score += 10 + level * 5;
    tickMs = Math.max(MIN_TICK, BASE_TICK - level * TICK_STEP);
    ripples.push({ x: nx, y: ny, t0: now });
    frameEl.classList.remove('hit');
    void frameEl.offsetWidth;
    frameEl.classList.add('hit');
    spawnFood();
    updateHud();
    // Board full: the player has won; treat it as a graceful end.
    if (!food) { die(now); }
  } else {
    snake.pop();
  }
}

function spawnFood() {
  const free = [];
  const occupied = new Set(snake.map(s => s.y * GRID + s.x));
  for (let i = 0; i < GRID * GRID; i++) if (!occupied.has(i)) free.push(i);
  if (!free.length) { food = null; return; }
  const idx = free[Math.random() * free.length | 0];
  food = { x: idx % GRID, y: Math.floor(idx / GRID) };
}

/* ============================================================
   INPUT
   ============================================================ */
const KEY_DIRS = {
  ArrowUp:    { x: 0,  y: -1 }, KeyW: { x: 0,  y: -1 },
  ArrowDown:  { x: 0,  y: 1  }, KeyS: { x: 0,  y: 1  },
  ArrowLeft:  { x: -1, y: 0  }, KeyA: { x: -1, y: 0  },
  ArrowRight: { x: 1,  y: 0  }, KeyD: { x: 1,  y: 0  }
};

function queueDirection(nd) {
  // Compare against the last queued direction so rapid double-taps
  // cannot reverse the snake into itself.
  const last = inputQueue.length ? inputQueue[inputQueue.length - 1] : dir;
  if (nd.x === last.x && nd.y === last.y) return;      // same direction
  if (nd.x === -last.x && nd.y === -last.y) return;    // 180° reversal
  if (inputQueue.length < 3) inputQueue.push(nd);
}

window.addEventListener('keydown', (e) => {
  const nd = KEY_DIRS[e.code];
  if (nd) {
    e.preventDefault();
    if (state === 'idle') start(nd);
    else if (state === 'running') queueDirection(nd);
    else if (state === 'paused') { resume(); queueDirection(nd); }
    return;
  }
  switch (e.code) {
    case 'Enter':
    case 'Space':
      e.preventDefault();
      if (state === 'idle' || state === 'over') start();
      else if (state === 'paused') resume();
      break;
    case 'KeyR':
      if (state === 'over') start();
      break;
    case 'KeyP':
    case 'Escape':
      if (state === 'running') pause();
      else if (state === 'paused') resume();
      break;
  }
});

// Auto-pause when the tab loses focus so the snake doesn't die unattended.
window.addEventListener('blur', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ============================================================
   HUD / OVERLAYS
   ============================================================ */
const pad = n => String(n).padStart(5, '0');

function updateHud() {
  scoreEl.textContent = pad(score);
  highEl.textContent = pad(highScore);
  highEl.classList.toggle('record', newRecord);
  const level = Math.floor(eaten / FOOD_PER_LEVEL) + 1;
  levelEl.textContent = String(level).padStart(2, '0');
  const ratio = (BASE_TICK - tickMs) / (BASE_TICK - MIN_TICK);
  const filled = 1 + Math.round(ratio * 9);
  speedEl.textContent = '▮'.repeat(filled) + '▯'.repeat(10 - filled);
}

function showOverlay(kind) {
  let html = '';
  if (kind === 'idle') {
    html = `
      <div class="boot">
        <p class="line" style="--i:0">&gt; SYS.BOOT ............ OK</p>
        <p class="line" style="--i:1">&gt; NEURAL LINK ......... ESTABLISHED</p>
        <p class="line" style="--i:2">&gt; GRID ${GRID}x${GRID} ........... MAPPED</p>
        <p class="line" style="--i:3">&gt; HIGH SCORE .......... ${pad(highScore)}</p>
      </div>
      <h1 class="glitch big" data-text="SNAKE.EXE">SNAKE.EXE</h1>
      <p class="hint">[ARROWS / WASD] NAVIGATE &nbsp;·&nbsp; [P] PAUSE</p>
      <p class="prompt">PRESS ANY KEY TO JACK IN_</p>`;
  } else if (kind === 'paused') {
    html = `
      <h1 class="glitch big" data-text="SUSPENDED">SUSPENDED</h1>
      <p class="hint">PROCESS HALTED BY OPERATOR</p>
      <p class="prompt">[P] RESUME_</p>`;
  } else if (kind === 'over') {
    html = `
      <h1 class="glitch big" data-text="CONNECTION LOST">CONNECTION LOST</h1>
      ${newRecord ? '<p class="record-tag">&gt;&gt; NEW RECORD &lt;&lt;</p>' : ''}
      <div class="stats">
        <div><span class="label">SCORE</span><span class="value">${pad(score)}</span></div>
        <div><span class="label">LENGTH</span><span class="value">${String(snake.length).padStart(3, '0')}</span></div>
        <div><span class="label">HIGH</span><span class="value${newRecord ? ' record' : ''}">${pad(highScore)}</span></div>
      </div>
      <p class="prompt">[ENTER] REBOOT_</p>`;
  }
  overlayEl.innerHTML = html;
  overlayEl.classList.remove('hidden');
}

function hideOverlay() {
  overlayEl.classList.add('hidden');
}

/* ============================================================
   RENDERING
   ============================================================ */
function roundRect(x, y, w, h, r) {
  gctx.beginPath();
  if (gctx.roundRect) { gctx.roundRect(x, y, w, h, r); return; }
  gctx.moveTo(x + r, y);
  gctx.arcTo(x + w, y, x + w, y + h, r);
  gctx.arcTo(x + w, y + h, x, y + h, r);
  gctx.arcTo(x, y + h, x, y, r);
  gctx.arcTo(x, y, x + w, y, r);
  gctx.closePath();
}

function drawGrid() {
  const size = GRID * cell;
  gctx.fillStyle = '#020a05';
  gctx.fillRect(0, 0, size, size);
  gctx.strokeStyle = 'rgba(0, 255, 102, 0.07)';
  gctx.lineWidth = 1;
  gctx.beginPath();
  for (let i = 1; i < GRID; i++) {
    const p = i * cell + 0.5;
    gctx.moveTo(p, 0); gctx.lineTo(p, size);
    gctx.moveTo(0, p); gctx.lineTo(size, p);
  }
  gctx.stroke();
}

function drawFood(t) {
  if (!food) return;
  const pulse = 0.78 + 0.22 * Math.sin(t / 170);
  const cx = food.x * cell + cell / 2;
  const cy = food.y * cell + cell / 2;
  const r = cell * 0.36 * pulse;

  gctx.save();
  gctx.translate(cx, cy);

  // Glowing magenta diamond core
  gctx.shadowColor = '#ff00c8';
  gctx.shadowBlur = 18;
  gctx.fillStyle = '#ff00c8';
  gctx.beginPath();
  gctx.moveTo(0, -r); gctx.lineTo(r, 0); gctx.lineTo(0, r); gctx.lineTo(-r, 0);
  gctx.closePath();
  gctx.fill();
  gctx.shadowBlur = 0;
  gctx.fillStyle = '#ffffff';
  gctx.fillRect(-r * 0.22, -r * 0.22, r * 0.44, r * 0.44);

  // Rotating cyan targeting reticle
  gctx.rotate(t / 900);
  gctx.strokeStyle = 'rgba(0, 229, 255, 0.75)';
  gctx.lineWidth = 1.5;
  const R = cell * 0.48;
  for (let k = 0; k < 4; k++) {
    const a = k * Math.PI / 2;
    gctx.beginPath();
    gctx.arc(0, 0, R, a + 0.3, a + Math.PI / 2 - 0.3);
    gctx.stroke();
  }
  gctx.restore();
}

function drawSnake(t) {
  const n = snake.length;
  const flashing = state === 'over' && t < dyingUntil && ((t / 80) | 0) % 2 === 0;

  for (let i = n - 1; i >= 0; i--) {
    const s = snake[i];
    const k = n > 1 ? i / (n - 1) : 0;        // 0 = head, 1 = tail
    const inset = 2 + 2.5 * k;
    const x = s.x * cell + inset;
    const y = s.y * cell + inset;
    const w = cell - inset * 2;

    if (flashing) {
      gctx.fillStyle = '#ff00c8';
      gctx.shadowBlur = 0;
    } else {
      // Cyan head fading into green tail.
      gctx.fillStyle = `hsl(${186 - 44 * k} 100% ${58 - 26 * k}%)`;
      if (i === 0)      { gctx.shadowColor = '#00e5ff'; gctx.shadowBlur = 18; }
      else if (i < 4)   { gctx.shadowColor = '#00ff66'; gctx.shadowBlur = 8; }
      else              { gctx.shadowBlur = 0; }
    }
    roundRect(x, y, w, w, Math.max(2, cell * 0.18));
    gctx.fill();
  }
  gctx.shadowBlur = 0;

  // Head "sensors": two dark dots offset toward the direction of travel.
  const h = snake[0];
  const cx = h.x * cell + cell / 2;
  const cy = h.y * cell + cell / 2;
  const fx = dir.x * cell * 0.18, fy = dir.y * cell * 0.18;        // forward offset
  const px = dir.y !== 0 ? 1 : 0, py = dir.x !== 0 ? 1 : 0;        // perpendicular axis
  const side = cell * 0.17;
  gctx.fillStyle = '#021a12';
  gctx.beginPath();
  gctx.arc(cx + fx + px * side, cy + fy + py * side, cell * 0.08, 0, Math.PI * 2);
  gctx.arc(cx + fx - px * side, cy + fy - py * side, cell * 0.08, 0, Math.PI * 2);
  gctx.fill();
}

function drawRipples(t) {
  ripples = ripples.filter(r => t - r.t0 < 420);
  for (const r of ripples) {
    const k = (t - r.t0) / 420;
    gctx.strokeStyle = `rgba(0, 229, 255, ${1 - k})`;
    gctx.lineWidth = 2 * (1 - k) + 0.5;
    gctx.beginPath();
    gctx.arc(r.x * cell + cell / 2, r.y * cell + cell / 2, cell * (0.3 + k * 1.6), 0, Math.PI * 2);
    gctx.stroke();
  }
}

function render(t) {
  drawGrid();
  if (state === 'idle') return;        // overlay covers the board; keep it clean
  drawFood(t);
  drawSnake(t);
  drawRipples(t);
}

/* ============================================================
   MAIN LOOP
   Fixed-timestep logic (tickMs) with per-frame rendering so the
   glow, pulses and ripples animate smoothly between moves.
   ============================================================ */
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(100, lastT ? t - lastT : 0);
  lastT = t;

  drawRain(t);

  if (state === 'running') {
    acc += dt;
    while (acc >= tickMs && state === 'running') {
      acc -= tickMs;
      step(t);
    }
  }
  render(t);
}

/* ============================================================
   BOOT
   ============================================================ */
function onResize() {
  resizeRain();
  resizeGame();
  render(performance.now());
}
window.addEventListener('resize', onResize);

onResize();
reset();
showOverlay('idle');
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
