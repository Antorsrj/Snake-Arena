<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON SNAKE // CYBERPUNK EDITION</title>
<style>
/* ──────────────────────────────────────────────
   NEON SNAKE — CYBERPUNK / MATRIX AESTHETIC
   ────────────────────────────────────────────── */

/* Reset & base */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #050505;
  color: #00ff41;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  user-select: none;
  -webkit-user-select: none;
}

/* ═══════════════════ MATRIX DIGITAL RAIN ═══════════════════ */
#matrix-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* ═══════════════════ SCANLINE OVERLAY ═══════════════════ */
#scanlines {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.15) 0px,
    rgba(0, 0, 0, 0.15) 1px,
    transparent 1px,
    transparent 4px
  );
  pointer-events: none;
}

/* ═══════════════════ CRT VIGNETTE ═══════════════════ */
#vignette {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
}

/* ═══════════════════ GAME CONTAINER ═══════════════════ */
#game-container {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  width: 100vw;
}

#game-board-wrapper {
  position: relative;
  padding: 20px;
  border: 2px solid #00ff41;
  box-shadow:
    0 0 15px #00ff41,
    0 0 30px rgba(0, 255, 65, 0.3),
    inset 0 0 20px rgba(0, 255, 65, 0.05);
  background: rgba(0, 10, 0, 0.85);
  backdrop-filter: blur(4px);
}

/* ═══════════════════ GLITCH EFFECT ═══════════════════ */
.glitch-border {
  position: absolute;
  top: -2px;
  left: -2px;
  right: -2px;
  bottom: -2px;
  pointer-events: none;
  animation: glitch-border 3s infinite;
}

@keyframes glitch-border {
  0%   { border-color: #00ff41; clip-path: inset(0 0 0 0); }
  10%  { border-color: #00ff41; }
  12%  { border-color: #ff00ff; clip-path: inset(20% 0 0 0); }
  14%  { border-color: #00ff41; clip-path: inset(0 0 0 0); }
  20%  { border-color: #00ff41; clip-path: inset(0 0 50% 0); }
  22%  { border-color: #00ff41; clip-path: inset(0 0 0 0); }
  30%  { border-color: #00ffff; clip-path: inset(0 30% 0 0); }
  32%  { border-color: #00ff41; clip-path: inset(0 0 0 0); }
  60%  { border-color: #00ff41; }
  62%  { border-color: #00ffff; clip-path: inset(40% 0 0 0); }
  64%  { border-color: #00ff41; clip-path: inset(0 0 0 0); }
  80%  { border-color: #00ff41; clip-path: inset(0 0 0 0); }
  82%  { border-color: #ff00ff; clip-path: inset(0 0 0 30%); }
  84%  { border-color: #00ff41; clip-path: inset(0 0 0 0); }
  100% { border-color: #00ff41; clip-path: inset(0 0 0 0); }
}

/* ═══════════════════ GAME BOARD ═══════════════════ */
#game-board {
  display: inline-block;
  position: relative;
}

/* ═══════════════════ HUD ═══════════════════ */
#hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding: 10px 15px;
  border-bottom: 1px solid rgba(0, 255, 65, 0.3);
}

#hud .label {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(0, 255, 65, 0.6);
}

#hud .value {
  font-size: 20px;
  font-weight: bold;
  color: #00ff41;
  text-shadow: 0 0 8px #00ff41, 0 0 15px #00ff41;
  letter-spacing: 1px;
}

/* ═══════════════════ GRID OVERLAY ═══════════════════ */
#grid-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#grid-overlay canvas {
  display: block;
}

/* ═══════════════════ OVERLAYS ═══════════════════ */
.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(0, 5, 0, 0.88);
  z-index: 20;
}

.overlay.hidden { display: none; }

/* ═══════════════════ MAIN MENU ═══════════════════ */
#menu h1 {
  font-size: 52px;
  font-weight: 900;
  text-align: center;
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 4px;
  color: #00ff41;
  text-shadow:
    0 0 10px #00ff41,
    0 0 20px #00ff41,
    0 0 40px rgba(0, 255, 65, 0.4);
  animation: title-pulse 2s ease-in-out infinite;
  position: relative;
}

@keyframes title-pulse {
  0%, 100% { text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41, 0 0 40px rgba(0,255,65,0.4); }
  50% { text-shadow: 0 0 15px #00ff41, 0 0 30px #00ff41, 0 0 50px rgba(0,255,65,0.6), 0 0 80px rgba(0,255,65,0.2); }
}

.glitch-title {
  position: relative;
  display: inline-block;
}

.glitch-title::before,
.glitch-title::after {
  content: attr(data-text);
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.glitch-title::before {
  color: #ff00ff;
  animation: glitch-slide-1 2.5s infinite;
  clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
}

.glitch-title::after {
  color: #00ffff;
  animation: glitch-slide-2 2.5s infinite;
  clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
}

@keyframes glitch-slide-1 {
  0%, 90%, 100% { transform: translate(0); }
  92% { transform: translate(-3px, 2px); }
  94% { transform: translate(3px, -2px); }
  96% { transform: translate(-2px, 1px); }
}

@keyframes glitch-slide-2 {
  0%, 90%, 100% { transform: translate(0); }
  92% { transform: translate(3px, -2px); }
  94% { transform: translate(-3px, 2px); }
  96% { transform: translate(2px, -1px); }
}

#menu h2 {
  font-size: 14px;
  letter-spacing: 5px;
  color: #00ffff;
  text-shadow: 0 0 8px #00ffff;
  margin-bottom: 25px;
}

#menu .start-btn {
  font-family: 'Courier New', monospace;
  font-size: 18px;
  padding: 12px 40px;
  border: 2px solid #00ff41;
  background: transparent;
  color: #00ff41;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 3px;
  transition: all 0.2s;
  text-shadow: 0 0 6px #00ff41;
}

#menu .start-btn:hover {
  background: #00ff41;
  color: #000;
  box-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41;
}

/* ═══════════════════ GAME OVER ═══════════════════ */
#game-over h2 {
  font-size: 42px;
  font-weight: 900;
  color: #ff00ff;
  text-shadow: 0 0 15px #ff00ff, 0 0 30px #ff00ff;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 3px;
}

#game-over .final-score {
  font-size: 22px;
  color: #00ffff;
  text-shadow: 0 0 8px #00ffff;
  margin-bottom: 3px;
}

#game-over .high-score-hint {
  font-size: 12px;
  color: rgba(0, 255, 65, 0.5);
  margin-bottom: 20px;
}

#game-over .restart-btn {
  font-family: 'Courier New', monospace;
  font-size: 16px;
  padding: 10px 35px;
  border: 2px solid #00ffff;
  background: transparent;
  color: #00ffff;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 3px;
  transition: all 0.2s;
  text-shadow: 0 0 6px #00ffff;
}

#game-over .restart-btn:hover {
  background: #00ffff;
  color: #000;
  box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
}

/* ═══════════════════ CONTROLS HINT ═══════════════════ */
#controls-hint {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(0, 255, 65, 0.35);
  text-transform: uppercase;
  z-index: 15;
  animation: blink-hint 2s ease-in-out infinite;
}

@keyframes blink-hint {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.8; }
}

/* ═══════════════════ MOBILE TAP CONTROLS ═══════════════════ */
#mobile-controls {
  display: none;
  position: fixed;
  bottom: 10px;
  left: 0;
  width: 100%;
  z-index: 30;
  padding: 10px;
  justify-content: center;
  gap: 10px;
}

#mobile-controls .ctrl-btn {
  width: 56px;
  height: 56px;
  border: 1px solid rgba(0, 255, 65, 0.5);
  background: rgba(0, 20, 0, 0.7);
  color: #00ff41;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  -webkit-tap-highlight-color: transparent;
}

#mobile-controls .ctrl-btn:active {
  background: #00ff41;
  color: #000;
  box-shadow: 0 0 15px #00ff41;
}

@media (max-width: 600px) {
  #mobile-controls { display: flex; }
  #menu h1 { font-size: 36px; }
  #game-board-wrapper { padding: 10px; }
}

/* ═══════════════════ RESPONSIVE GAME BOARD ═══════════════════ */
#game-board-wrapper {
  max-width: 95vw;
  max-height: 95vh;
  width: fit-content;
  height: fit-content;
}

@media (max-height: 700px) {
  #game-board-wrapper {
    padding: 10px;
    transform: scale(0.9);
  }
}

@media (max-height: 500px) {
  #game-board-wrapper {
    transform: scale(0.75);
  }
}
</style>
</head>
<body>

<!-- ═══════════════════ CANVAS LAYERS ═══════════════════ -->
<canvas id="matrix-canvas"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>

<!-- ═══════════════════ GAME AREA ═══════════════════ -->
<div id="game-container">
  <div id="game-board-wrapper">
    <div class="glitch-border"></div>

    <!-- HUD -->
    <div id="hud">
      <div class="label">SCORE<span id="score-val">0</span></div>
      <div class="label">HIGH<span id="high-score-val">0</span></div>
      <div class="label">LEVEL<span id="level-val">1</span></div>
    </div>

    <!-- Game Board -->
    <div id="game-board"></div>

    <!-- Grid Overlay (SVG) -->
    <div id="grid-overlay">
      <canvas id="grid-canvas"></canvas>
    </div>

    <!-- Main Menu Overlay -->
    <div id="menu" class="overlay">
      <h1 class="glitch-title" data-text="NEON SNAKE">NEON SNAKE</h1>
      <h2>/// CYBERPUNK EDITION ///</h2>
      <button class="start-btn" id="start-btn">INITIALIZE</button>
    </div>

    <!-- Game Over Overlay -->
    <div id="game-over" class="overlay hidden">
      <h2>SYSTEM FAILURE</h2>
      <div class="final-score">SCORE: <span id="go-score">0</span></div>
      <div class="high-score-hint">NEW RECORD? HIGH: <span id="go-high">0</span></div>
      <button class="restart-btn" id="restart-btn">REBOOT SYSTEM</button>
    </div>

    <!-- Controls Hint -->
    <div id="controls-hint">← → WASD — STEER | SPACE — PAUSE</div>
  </div>

  <!-- Mobile Controls -->
  <div id="mobile-controls">
    <div class="ctrl-btn" id="btn-left">◀</div>
    <div class="ctrl-btn" id="btn-up">▲</div>
    <div class="ctrl-btn" id="btn-down">▼</div>
    <div class="ctrl-btn" id="btn-right">▶</div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   NEON SNAKE — CYBERPUNK EDITION
   ═══════════════════════════════════════════════════════════════════ */

/* ─────────────────────────────────────────────────────
   CONSTANTS
   ───────────────────────────────────────────────────── */
const GRID_SIZE = 20;        // cells per row / column
const CELL = 20;             // pixels per cell
const INITIAL_SPEED = 150;   // ms per tick
const MIN_SPEED = 60;        // fastest tick
const SPEED_DECREMENT = 2;   // ms less per food eaten

const DIR = {
  UP:    { x: 0,  y: -1 },
  DOWN:  { x: 0,  y: 1 },
  LEFT:  { x: -1, y: 0 },
  RIGHT: { x: 1,  y: 0 }
};

/* ─────────────────────────────────────────────────────
   COLOR PALETTE
   ───────────────────────────────────────────────────── */
const COLOR_SNAKE_HEAD = '#00ff41';
const COLOR_SNAKE_BODY = '#00cc33';
const COLOR_SNAKE_TAIL = '#008822';
const COLOR_FOOD = '#00ffff';
const COLOR_FOOD_GLOW = 'rgba(0, 255, 255, 0.3)';
const COLOR_PARTICLE = '#ff00ff';

/* ─────────────────────────────────────────────────────
   ELEMENTS
   ───────────────────────────────────────────────────── */
const $matrix = document.getElementById('matrix-canvas');
const $gridCanvas = document.getElementById('grid-canvas');
const $menu = document.getElementById('menu');
const $gameOver = document.getElementById('game-over');
const $scoreVal = document.getElementById('score-val');
const $highScoreVal = document.getElementById('high-score-val');
const $levelVal = document.getElementById('level-val');
const $goScore = document.getElementById('go-score');
const $goHigh = document.getElementById('go-high');
const $startBtn = document.getElementById('start-btn');
const $restartBtn = document.getElementById('restart-btn');

/* ─────────────────────────────────────────────────────
   MATRIX RAIN
   ───────────────────────────────────────────────────── */
(function initMatrix() {
  const ctx = $matrix.getContext('2d');
  const columns = Math.floor($matrix.width / 1.5);
  const characters = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789abcdefghijklmnopqrstuvwxyz';
  const charCount = characters.length;
  const drops = new Array(columns).fill(1);

  function draw() {
    ctx.fillStyle = 'rgba(5, 5, 5, 0.05)';
    ctx.fillRect(0, 0, $matrix.width, $matrix.height);

    ctx.font = '1.1em monospace';
    for (let i = 0; i < columns; i++) {
      const text = characters[Math.floor(Math.random() * charCount)];
      const x = i * 1.5;
      const y = drops[i] * 1.1;

      // Head is brighter green, tail fades to dark
      const fade = 1 - (drops[i] * 0.03);
      ctx.fillStyle = `rgba(0, 255, 65, ${fade * 0.5 + 0.1})`;
      ctx.fillText(text, x, y);

      if (y > $matrix.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ─────────────────────────────────────────────────────
   SCANLINES (CSS handled, but add subtle JS flicker)
   ───────────────────────────────────────────────────── */
(function initScanlines() {
  const overlay = document.getElementById('scanlines');
  setInterval(() => {
    const flicker = Math.random() < 0.05 ? '0.1' : '0.15';
    overlay.style.opacity = flicker;
  }, 50);
})();

/* ─────────────────────────────────────────────────────
   GAME STATE
   ───────────────────────────────────────────────────── */
let snake, direction, nextDirection, food, score, highScore, level, speed, loopId;

const state = {
  running: false,
  paused: false
};

/* ─────────────────────────────────────────────────────
   HIGH SCORE (localStorage)
   ───────────────────────────────────────────────────── */
function loadHighScore() {
  const saved = localStorage.getItem('neonSnakeHigh');
  return saved ? parseInt(saved) : 0;
}

function saveHighScore(v) {
  localStorage.setItem('neonSnakeHigh', v);
}

/* ─────────────────────────────────────────────────────
   INITIALIZATION
   ───────────────────────────────────────────────────── */
function initBoard() {
  // Compute dynamic board size based on viewport
  const wrapper = document.getElementById('game-board-wrapper');
  const availableW = wrapper.clientWidth - 40;
  const availableH = wrapper.clientHeight - 40;
  const maxW = Math.min(availableW, 600);
  const maxH = Math.min(availableH, 500);

  // Calculate grid dimensions
  const cols = Math.max(10, Math.floor(maxW / CELL));
  const rows = Math.max(10, Math.floor(maxH / CELL));

  // Create grid canvas
  const gridCanvas = $gridCanvas;
  gridCanvas.width = cols * CELL;
  gridCanvas.height = rows * CELL;
  const gctx = gridCanvas.getContext('2d');

  // Draw grid lines
  gctx.strokeStyle = 'rgba(0, 255, 65, 0.05)';
  gctx.lineWidth = 0.5;
  for (let x = 0; x <= cols; x++) {
    gctx.beginPath(); gctx.moveTo(x * CELL, 0); gctx.lineTo(x * CELL, rows * CELL); gctx.stroke();
  }
  for (let y = 0; y <= rows; y++) {
    gctx.beginPath(); gctx.moveTo(0, y * CELL); gctx.lineTo(cols * CELL, y * CELL); gctx.stroke();
  }

  // Update HUD
  $highScoreVal.textContent = highScore;

  // Resize game board container
  const board = document.getElementById('game-board');
  board.style.width = (cols * CELL) + 'px';
  board.style.height = (rows * CELL) + 'px';

  // Resize grid overlay
  const gridOverlay = document.getElementById('grid-overlay');
  gridOverlay.style.width = (cols * CELL) + 'px';
  gridOverlay.style.height = (rows * CELL) + 'px';

  return { cols, rows, gridCanvas, gctx };
}

function initGame() {
  const { cols, rows } = initBoard();

  const midX = Math.floor(cols / 2);
  const midY = Math.floor(rows / 2);

  snake = [
    { x: midX, y: midY },
    { x: midX - 1, y: midY },
    { x: midX - 2, y: midY }
  ];

  direction = DIR.RIGHT;
  nextDirection = DIR.RIGHT;
  score = 0;
  level = 1;
  speed = INITIAL_SPEED;
  state.running = true;
  state.paused = false;

  spawnFood(cols, rows);
  updateHUD();
  drawBoard();

  if (loopId) cancelAnimationFrame(loopId);
  gameLoop();
}

/* ─────────────────────────────────────────────────────
   FOOD SPAWN
   ───────────────────────────────────────────────────── */
function spawnFood(cols, rows) {
  let pos;
  do {
    pos = {
      x: Math.floor(Math.random() * cols),
      y: Math.floor(Math.random() * rows)
    };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

/* ─────────────────────────────────────────────────────
   DRAW BOARD
   ───────────────────────────────────────────────────── */
function drawBoard() {
  const { cols, rows, gctx } = initBoard(); // re-init to get gctx reference
  const ctx = gctx;

  // Clear
  ctx.clearRect(0, 0, cols * CELL, rows * CELL);

  // Draw food with glow
  ctx.shadowColor = COLOR_FOOD;
  ctx.shadowBlur = 12;
  ctx.fillStyle = COLOR_FOOD;
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Draw snake
  snake.forEach((seg, i) => {
    const x = seg.x * CELL;
    const y = seg.y * CELL;

    if (i === 0) {
      // Head — bright neon green
      ctx.fillStyle = COLOR_SNAKE_HEAD;
      ctx.shadowColor = COLOR_SNAKE_HEAD;
      ctx.shadowBlur = 10;
    } else {
      // Body — gradient from bright to dark
      const ratio = i / snake.length;
      ctx.fillStyle = i === snake.length - 1 ? COLOR_SNAKE_TAIL : COLOR_SNAKE_BODY;
      ctx.shadowColor = COLOR_SNAKE_BODY;
      ctx.shadowBlur = i < 3 ? 6 : 0;
    }

    // Draw rounded rect for each segment
    const pad = i === 0 ? 1 : 2;
    const radius = i === 0 ? 4 : 3;
    roundRect(ctx, x + 1, y + 1, CELL - 2, CELL - 2, radius);
    ctx.fill();

    // Draw eye on head
    if (i === 0) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#000';
      const eyeOffset = 5;
      const ex = x + CELL / 2;
      const ey = y + CELL / 2;
      const dir = direction;
      let exOff = 0, eyOff = 0;
      if (dir === DIR.UP) eyOff = -eyeOffset;
      if (dir === DIR.DOWN) eyOff = eyeOffset;
      if (dir === DIR.LEFT) exOff = -eyeOffset;
      if (dir === DIR.RIGHT) exOff = eyeOffset;

      ctx.beginPath();
      ctx.arc(ex + exOff, ey + eyOff, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  ctx.shadowBlur = 0;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* ─────────────────────────────────────────────────────
   GAME LOOP
   ───────────────────────────────────────────────────── */
function gameLoop() {
  if (!state.running || state.paused) return;

  loopId = requestAnimationFrame(gameLoop);

  // Move snake
  const dir = nextDirection;
  const head = { ...snake[0] };
  head.x += dir.x;
  head.y += dir.y;

  // Wall wrapping
  const { cols, rows } = initBoard();
  if (head.x < 0) head.x = cols - 1;
  if (head.x >= cols) head.x = 0;
  if (head.y < 0) head.y = rows - 1;
  if (head.y >= rows) head.y = 0;

  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  // Eat food
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    if (score % 50 === 0) level++;

    // Particles!
    spawnParticles(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2);

    updateHUD();
    spawnFood(cols, rows);
    drawBoard();

    // Increase speed
    speed = Math.max(MIN_SPEED, speed - SPEED_DECREMENT);
    clearInterval(loopId);
    clearInterval(state.interval);
    state.interval = setInterval(tick, speed);
  } else {
    snake.pop();
    drawBoard();
  }
}

/* ─────────────────────────────────────────────────────
   TICK (separate interval for speed control)
   ───────────────────────────────────────────────────── */
state.interval = setInterval(tick, INITIAL_SPEED);

function tick() {
  if (!state.running || state.paused) return;
  const dir = nextDirection;
  const head = { ...snake[0] };
  head.x += dir.x;
  head.y += dir.y;

  const { cols, rows } = initBoard();
  if (head.x < 0) head.x = cols - 1;
  if (head.x >= cols) head.x = 0;
  if (head.y < 0) head.y = rows - 1;
  if (head.y >= rows) head.y = 0;

  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    if (score % 50 === 0) level++;
    spawnParticles(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2);
    updateHUD();
    spawnFood(initBoard().cols, initBoard().rows);
    speed = Math.max(MIN_SPEED, speed - SPEED_DECREMENT);
    clearInterval(state.interval);
    state.interval = setInterval(tick, speed);
  } else {
    snake.pop();
  }
  drawBoard();
}

/* ─────────────────────────────────────────────────────
   HUD
   ───────────────────────────────────────────────────── */
function updateHUD() {
  $scoreVal.textContent = score;
  $levelVal.textContent = level;
}

/* ─────────────────────────────────────────────────────
   PARTICLES
   ───────────────────────────────────────────────────── */
let particles = [];

function spawnParticles(x, y) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 1,
      color: Math.random() > 0.5 ? COLOR_PARTICLE : COLOR_FOOD
    });
  }
}

function updateParticles() {
  if (!state.running || state.paused) {
    particles = [];
    return;
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.03;
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }

  // Draw particles
  const { cols, rows, gctx } = initBoard();
  gctx.clearRect(0, 0, cols * CELL, rows * CELL);

  particles.forEach(p => {
    gctx.globalAlpha = p.life;
    gctx.fillStyle = p.color;
    gctx.fillRect(p.x - 1, p.y - 1, 2, 2);
  });
  gctx.globalAlpha = 1;

  drawBoard();
}

/* ─────────────────────────────────────────────────────
   PAUSE
   ───────────────────────────────────────────────────── */
function togglePause() {
  state.paused = !state.paused;
  if (state.paused) {
    $gameOver.querySelector('h2').textContent = 'SYSTEM PAUSED';
    $gameOver.querySelector('.final-score').style.display = 'none';
    $gameOver.querySelector('.high-score-hint').style.display = 'none';
    $gameOver.querySelector('#go-score').style.display = 'none';
    $gameOver.querySelector('#go-high').style.display = 'none';
    $gameOver.querySelector('.restart-btn').style.display = 'none';
    $gameOver.classList.remove('hidden');
    document.getElementById('controls-hint').style.display = 'none';
  } else {
    $gameOver.classList.add('hidden');
    document.getElementById('controls-hint').style.display = '';
  }
}

/* ─────────────────────────────────────────────────────
   GAME OVER
   ───────────────────────────────────────────────────── */
function gameOver() {
  state.running = false;
  clearInterval(state.interval);
  state.interval = null;

  if (score > highScore) {
    highScore = score;
    saveHighScore(highScore);
  }

  $goScore.textContent = score;
  $goHigh.textContent = highScore;

  $gameOver.classList.remove('hidden');
  document.getElementById('controls-hint').style.display = 'none';
}

/* ─────────────────────────────────────────────────────
   INPUT
   ───────────────────────────────────────────────────── */
const keys = {};

document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  keys[key] = true;

  if (state.paused) {
    if (key === ' ' || key === 'p') togglePause();
    return;
  }

  switch (key) {
    case 'arrowup':
    case 'w':
      if (direction !== DIR.DOWN) nextDirection = DIR.UP; break;
    case 'arrowdown':
    case 's':
      if (direction !== DIR.UP) nextDirection = DIR.DOWN; break;
    case 'arrowleft':
    case 'a':
      if (direction !== DIR.RIGHT) nextDirection = DIR.LEFT; break;
    case 'arrowright':
    case 'd':
      if (direction !== DIR.LEFT) nextDirection = DIR.RIGHT; break;
    case ' ':
      togglePause(); break;
  }
});

document.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

// Mobile touch controls
const mobileBtns = {
  'btn-left':  DIR.LEFT,
  'btn-right': DIR.RIGHT,
  'btn-up':    DIR.UP,
  'btn-down':  DIR.DOWN
};

Object.keys(mobileBtns).forEach(id => {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    if (state.paused) return;
    const dir = mobileBtns[id];
    if (direction !== dir.opposite(dir)) nextDirection = dir;
  });
});

Object.defineProperty(DIR, 'opposite', {
  value: (d) => {
    if (d === DIR.UP) return DIR.DOWN;
    if (d === DIR.DOWN) return DIR.UP;
    if (d === DIR.LEFT) return DIR.RIGHT;
    if (d === DIR.RIGHT) return DIR.LEFT;
    return d;
  }
});

/* ─────────────────────────────────────────────────────
   BUTTON EVENTS
   ───────────────────────────────────────────────────── */
$startBtn.addEventListener('click', () => {
  $menu.classList.add('hidden');
  initGame();
});

$restartBtn.addEventListener('click', () => {
  $gameOver.classList.add('hidden');
  document.getElementById('controls-hint').style.display = '';
  initGame();
});

/* ─────────────────────────────────────────────────────
   PARTICLES (separate canvas for performance)
   ───────────────────────────────────────────────────── */
(function initParticlesCanvas() {
  const pCanvas = document.createElement('canvas');
  pCanvas.style.position = 'absolute';
  pCanvas.style.top = '0';
  pCanvas.style.left = '0';
  pCanvas.style.pointerEvents = 'none';
  pCanvas.style.zIndex = '15';
  document.getElementById('game-board-wrapper').appendChild(pCanvas);

  const pCtx = pCanvas.getContext('2d');
  let pW, pH;

  function resizeParticles() {
    const wrapper = document.getElementById('game-board-wrapper');
    pW = wrapper.clientWidth;
    pH = wrapper.clientHeight;
    pCanvas.width = pW;
    pCanvas.height = pH;
  }

  resizeParticles();
  window.addEventListener('resize', resizeParticles);

  function drawParticles() {
    pCtx.clearRect(0, 0, pW, pH);
    particles.forEach(p => {
      pCtx.globalAlpha = p.life;
      pCtx.fillStyle = p.color;
      pCtx.fillRect(p.x, p.y, 2, 2);
    });
    pCtx.globalAlpha = 1;
    requestAnimationFrame(drawParticles);
  }
  drawParticles();
})();

/* ═══════════════════ BOOT ═══════════════════ */
highScore = loadHighScore();
updateHUD();
</script>
