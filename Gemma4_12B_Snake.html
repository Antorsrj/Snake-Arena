<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL_SNAKE // CYBER_REWRITE</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --bg-black: #050505;
            --glitch-speed: 0.2s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-black);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1000px;
        }

        /* Matrix Rain Background Layer */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            opacity: 0.15;
        }

        /* Scanline Effect */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }

        #game-container {
            position: relative;
            border: 2px solid var(--neon-green);
            padding: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            border: 1px solid rgba(0, 255, 65, 0.5);
        }

        /* UI Elements */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .stats {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 1.2rem;
            text-shadow: 0 0 5px var(--neon-green);
        }

        #game-over {
            display: none;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border: 1px solid var(--neon-magenta);
            pointer-events: auto;
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        h1 {
            font-size: 3rem;
            color: var(--neon-magenta);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .btn {
            margin-top: 20px;
            padding: 15px 30px;
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            font-family: inherit;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--neon-green);
            color: var(--bg-black);
            box-shadow: 0 0 20px var(--neon-green);
        }

        .instructions {
            margin-top: 10px;
            font-size: 0.8rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <canvas id="matrix-bg"></canvas>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div class="stats">
                SCORE: <span id="score">0000</span><br>
                HIGH: <span id="highScore">0000</span>
            </div>
            
            <div id="game-over">
                <h1 id="status-text">SYSTEM_FAILURE</h1>
                <p>Final Score: <span id="final-score">0</span></p>
                <button class="btn" onclick="resetGame()">REBOOT_SYSTEM</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * GAME CONFIGURATION
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const matrixCanvas = document.getElementById('matrix-bg');
        const mctx = matrixCanvas.getContext('2d');

        const GRID_SIZE = 20;
        let width, height, rows, cols;
        
        let snake = [];
        let food = {};
        let dx = GRID_SIZE;
        let dy = 0;
        let nextDx = GRID_SIZE;
        let nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snake_high_score') || 0;
        let gameSpeed = 100;
        let lastTime = 0;
        let isGameOver = false;

        // UI Elements
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const finalScoreEl = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over');
        const statusText = document.getElementById('status-text');

        /**
         * INITIALIZATION
         */
        function init() {
            resize();
            highScoreEl.innerText = highScore.toString().padStart(4, '0');
            resetGame();
            requestAnimationFrame(gameLoop);
        }

        function resize() {
            // Maintain a reasonable aspect ratio while filling most of the screen
            const padding = 40;
            const availableWidth = window.innerWidth - padding;
            const availableHeight = window.innerHeight - padding;
            
            // Set canvas size based on smaller dimension to keep it square-ish
            const size = Math.min(availableWidth, availableHeight, 800);
            
            canvas.width = size;
            canvas.height = size;
            
            width = canvas.width;
            height = canvas.height;
            
            cols = Math.floor(width / GRID_SIZE);
            rows = Math.floor(height / GRID_SIZE);

            // Resize background
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
        }

        function resetGame() {
            snake = [
                {x: 10 * GRID_SIZE, y: 10 * GRID_SIZE},
                {x: 9 * GRID_SIZE, y: 10 * GRID_SIZE},
                {x: 8 * GRID_SIZE, y: 10 * GRID_SIZE}
            ];
            dx = GRID_SIZE;
            dy = 0;
            nextDx = GRID_SIZE;
            nextDy = 0;
            score = 0;
            gameSpeed = 100;
            isGameOver = false;
            scoreEl.innerText = "0000";
            gameOverScreen.style.display = 'none';
            spawnFood();
        }

        /**
         * MATRIX RAIN EFFECT
         */
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+";
        const drops = [];
        for(let i = 0; i < Math.floor(matrixCanvas.width / 20); i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            mctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            mctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            
            mctx.fillStyle = '#00ff41';
            mctx.font = '15px monospace';

            for(let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                mctx.fillText(text, i * 20, drops[i] * 20);
                
                if(drops[i] * 20 > matrixCanvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        /**
         * GAME LOGIC
         */
        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * cols) * GRID_SIZE,
                y: Math.floor(Math.random() * rows) * GRID_SIZE
            };
            // Prevent food from spawning on snake
            snake.forEach(part => {
                if(part.x === food.x && part.y === food.y) spawnFood();
            });
        }

        function update() {
            if (isGameOver) return;

            // Update direction from buffer
            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision
            if (head.x < 0 || head.x >= width || head.y < 0 || head.y >= height) {
                endGame();
                return;
            }

            // Self Collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // Food Collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score.toString().padStart(4, '0');
                gameSpeed = Math.max(40, 100 - (score / 5)); // Increase speed
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            // Clear canvas with slight trail
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
            ctx.fillRect(0, 0, width, height);

            // Draw Food
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'var(--neon-cyan)';
            ctx.fillStyle = '#00f3ff';
            ctx.fillRect(food.x + 2, food.y + 2, GRID_SIZE - 4, GRID_SIZE - 4);

            // Draw Snake
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'var(--neon-green)';
            snake.forEach((part, index) => {
                // Head is brighter
                if (index === 0) {
                    ctx.fillStyle = '#fff';
                    // Eyes
                    ctx.fillRect(part.x + 4, part.y + 4, GRID_SIZE - 8, GRID_SIZE - 8);
                } else {
                    ctx.fillStyle = '#00ff41';
                    // Body segments slightly smaller
                    ctx.fillRect(part.x + 1, part.y + 1, GRID_SIZE - 2, GRID_SIZE - 2);
                }
            });

            // Reset shadow
            ctx.shadowBlur = 0;
        }

        function endGame() {
            isGameOver = true;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_high_score', highScore);
                highScoreEl.innerText = highScore.toString().padStart(4, '0');
            }
            
            finalScoreEl.innerText = score;
            statusText.innerText = "CONNECTION_LOST";
            gameOverScreen.style.display = 'block';
        }

        function gameLoop(timestamp) {
            const delta = timestamp - lastTime;

            drawMatrix();

            if (delta > gameSpeed) {
                lastTime = timestamp;
                update();
                draw();
            }

            requestAnimationFrame(gameLoop);
        }

        /**
         * INPUT HANDLING
         */
        window.addEventListener('keydown', e => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (dy === 0) { nextDx = 0; nextDy = -GRID_SIZE; }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (dy === 0) { nextDx = 0; nextDy = GRID_SIZE; }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (dx === 0) { nextDx = -GRID_SIZE; nextDy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (dx === 0) { nextDx = GRID_SIZE; nextDy = 0; }
                    break;
            }
            // Prevent scrolling
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) {
                e.preventDefault();
            }
        });

        window.addEventListener('resize', resize);

        // Start
        init();
    </script>
</body>
</html>
