<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKES // NEURAL GRID</title>
    <style>
        /* ============ RESET & BASE ============ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg:        #020302;
            --panel:     rgba(8, 14, 9, .9);
            --green:     #00ff41;
            --green-dim: rgba(0, 255, 65, .55);
            --cyan:      #00f0ff;
            --magenta:   #ff00ff;
            --line:      rgba(0, 255, 65, .12);
            --mono:      'Courier New', 'Consolas', monospace;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: #cfe8d2;
            font-family: var(--mono);
        }

        body.playing { overflow: hidden; }

        /* ============ BACKGROUND LAYERS ============ */
        #matrix {
            position: fixed; inset: 0; z-index: 0;
            opacity: .3; pointer-events: none;
        }
        .scanlines {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: repeating-linear-gradient(0deg,
                rgba(0,0,0,.14) 0 1px, transparent 1px 3px);
            mix-blend-mode: overlay;
        }
        .vignette {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%);
        }

        /* ============ MAIN CONTAINER ============ */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ============ TERMINAL WINDOW ============ */
        .terminal {
            position: relative;
            width: 100%;
            background: rgba(5, 5, 10, 0.92);
            border: 2px solid var(--green);
            border-radius: 6px;
            box-shadow:
                0 0 20px var(--green),
                inset 0 0 30px rgba(0, 255, 65, 0.05);
            backdrop-filter: blur(6px);
            overflow: hidden;
            margin-bottom: 16px;
        }

        .terminal::before {
            content: '';
            position: absolute; top: 0; left: 0;
            width: 100%; height: 12px;
            background: linear-gradient(90deg,
                var(--green) 0%, var(--cyan) 20%,
                var(--magenta) 50%, var(--green) 80%, var(--cyan) 100%);
            z-index: 2;
        }

        .terminal-header {
            display: flex; align-items: center;
            padding: 10px 16px;
            background: rgba(0,0,0,.4);
            border-bottom: 1px solid var(--green);
            font-size: 12px;
            color: var(--cyan);
            position: relative; z-index: 2;
        }

        .window-controls {
            display: flex; gap: 8px; margin-right: 12px;
        }
        .window-btn {
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--green); box-shadow: 0 0 5px var(--green);
            transition: all .2s;
        }
        .window-btn:hover { transform: scale(1.2); }
        .window-btn.red { background: #ff4444; box-shadow: 0 0 5px #ff4444; }
        .window-btn.yellow { background: #ffaa00; box-shadow: 0 0 5px #ffaa00; }
        .window-btn.green { background: #00cc44; box-shadow: 0 0 5px #00cc44; }

        .terminal-title {
            font-size: 11px; letter-spacing: 1px;
            color: var(--cyan); flex: 1;
        }

        /* ============ GAME HEADER / HUD ============ */
        .game-header {
            display: flex; justify-content: space-between;
            align-items: center; padding: 14px 20px;
            position: relative; z-index: 2;
        }
        .game-title {
            font-size: 26px; letter-spacing: 2px;
            color: var(--green);
            text-shadow: 0 0 10px var(--green), 0 0 20px var(--green);
            animation: glitch 3s infinite;
        }
        .game-title::before, .game-title::after {
            content: "SNAKES";
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; color: var(--green);
        }
        .game-title::before { left: 2px; text-shadow: -2px 0 var(--magenta); animation: glitch-anim 2s infinite; }
        .game-title::after { left: 1px; text-shadow: -1px 0 var(--cyan); animation: glitch-anim 1.5s infinite reverse; }

        @keyframes glitch {
            0%,100%{text-shadow:2px 0 var(--magenta),-2px 0 var(--cyan)}
            33%{text-shadow:-2px 0 var(--magenta),2px 0 var(--cyan)}
            66%{text-shadow:2px 0 var(--magenta),-2px 0 var(--cyan)}
        }
        @keyframes glitch-anim {
            0%{clip:rect(10px,9999px,20px,0)}
            20%{clip:rect(40px,9999px,50px,0)}
            40%{clip:rect(70px,9999px,80px,0)}
            60%{clip:rect(30px,9999px,40px,0)}
            80%{clip:rect(60px,9999px,70px,0)}
            100%{clip:rect(10px,9999px,20px,0)}
        }

        .hud-stats {
            display: flex; gap: 24px; align-items: center;
        }
        .stat-block { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .stat-label {
            font-size: 10px; letter-spacing: 2px; color: var(--cyan);
            text-transform: uppercase; opacity: .7;
        }
        .stat-value {
            font-size: 22px; font-weight: bold; color: var(--green);
            text-shadow: 0 0 8px var(--green); line-height: 1;
        }

        /* ============ GAME AREA ============ */
        .game-area {
            position: relative; width: 100%; max-width: 520px;
            margin: 0 auto; padding: 16px;
        }
        #game-canvas {
            display: block; width: 100%;
            background: rgba(0,0,0,.75);
            border: 1px solid var(--green);
            border-radius: 4px;
            box-shadow:
                0 0 20px rgba(0,255,65,.2),
                inset 0 0 15px rgba(0,255,65,.08);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* ============ CONTROLS HINT ============ */
        .controls-hint {
            margin-top: 14px; padding: 10px; text-align: center;
            font-size: 12px; color: var(--cyan); opacity: .6;
            letter-spacing: 2px; position: relative; z-index: 2;
        }
        .controls-hint .key {
            display: inline-block; min-width: 26px; height: 26px;
            line-height: 24px; border: 1px solid var(--green);
            border-radius: 3px; margin: 0 2px;
            color: var(--green); text-shadow: 0 0 5px var(--green);
            background: rgba(0,255,65,.1);
            box-shadow: 0 0 8px rgba(0,255,65,.3);
        }

        /* ============ GAME OVER SCREEN ============ */
        .game-over {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(5,5,10,.95); z-index: 20;
            padding: 20px; text-align: center;
        }
        .game-over.show { display: flex; }
        .game-over h1 {
            font-size: 44px; color: var(--magenta);
            text-shadow: 0 0 10px var(--magenta), 0 0 20px var(--magenta), 0 0 40px var(--magenta);
            margin-bottom: 16px; letter-spacing: 3px;
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100%{opacity:.6;text-shadow:0 0 5px var(--magenta),0 0 10px var(--magenta),0 0 20px var(--magenta)}
            50%{opacity:1;text-shadow:0 0 10px var(--magenta),0 0 20px var(--magenta),0 0 40px var(--magenta),0 0 60px var(--magenta)}
        }
        .game-over .final-score {
            font-size: 26px; color: var(--cyan); margin-bottom: 8px;
            text-shadow: 0 0 8px var(--cyan);
        }
        .game-over .high-score {
            font-size: 22px; color: var(--green); margin-bottom: 28px;
            text-shadow: 0 0 8px var(--green);
        }
        .restart-btn {
            padding: 12px 36px; font-size: 15px; font-family: var(--mono);
            font-weight: bold; color: var(--bg);
            background: linear-gradient(135deg, var(--green), var(--cyan));
            border: 2px solid var(--green); border-radius: 4px;
            cursor: pointer; letter-spacing: 2px; text-transform: uppercase;
            box-shadow: 0 0 15px var(--green); transition: all .3s;
            position: relative; overflow: hidden;
        }
        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--green), 0 5px 15px rgba(0,0,0,.3);
            background: linear-gradient(135deg, var(--cyan), var(--green));
        }
        .restart-btn:active { transform: translateY(1px); }

        /* ============ START SCREEN ============ */
        .start-screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(5,5,10,.98); z-index: 30;
            text-align: center; padding: 20px;
        }
        .start-screen h1 {
            font-size: 52px; color: var(--green);
            text-shadow: 0 0 15px var(--green), 0 0 30px var(--green);
            letter-spacing: 4px; margin-bottom: 24px;
            animation: glitch 2s infinite;
        }
        .start-screen h2 {
            font-size: 18px; color: var(--cyan);
            margin-bottom: 16px; letter-spacing: 3px; opacity: .8;
        }
        .start-screen .instructions {
            font-size: 13px; color: var(--magenta);
            margin-bottom: 24px; line-height: 1.8; opacity: .7;
        }
        .start-screen .instructions .key-hint {
            display: inline-block; width: 22px; height: 22px;
            line-height: 20px; border: 1px solid var(--magenta);
            border-radius: 3px; margin: 0 3px;
            color: var(--magenta); text-shadow: 0 0 5px var(--magenta);
            background: rgba(255,0,255,.1);
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 600px) {
            .hud-stats { gap: 16px; }
            .stat-value { font-size: 18px; }
            .start-screen h1 { font-size: 40px; }
            .game-over h1 { font-size: 34px; }
        }

        /* ============ GLITCH OVERLAY ============ */
        #glitch-overlay {
            position: fixed; inset: 0; pointer-events: none;
            z-index: 5; mix-blend-mode: screen; opacity: 0;
            transition: opacity .1s;
        }
    </style>
</head>
<body>

    <!-- background layers -->
    <canvas id="matrix"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- glitch overlay -->
    <div id="glitch-overlay"></div>

    <!-- main container -->
    <div class="container">
        <!-- terminal window -->
        <div class="terminal">
            <div class="terminal-header">
                <div class="window-controls">
                    <div class="window-btn red"></div>
                    <div class="window-btn yellow"></div>
                    <div class="window-btn green"></div>
                </div>
                <span class="terminal-title">~/neural-snake/grid<span style="animation: blink 1s infinite">_</span></span>
            </div>

            <!-- game header / hud -->
            <div class="game-header">
                <h1 class="game-title">SNAKES</h1>
                <div class="hud-stats">
                    <div class="stat-block">
                        <span class="stat-label">Score</span>
                        <span class="stat-value" id="score">0</span>
                    </div>
                    <div class="stat-block">
                        <span class="stat-label">High Score</span>
                        <span class="stat-value" id="high-score">0</span>
                    </div>
                    <div class="stat-block">
                        <span class="stat-label">Level</span>
                        <span class="stat-value" id="level">1</span>
                    </div>
                </div>
            </div>

            <!-- game area -->
            <div class="game-area">
                <canvas id="game-canvas" width="500" height="500"></canvas>

                <!-- game over screen -->
                <div class="game-over" id="game-over">
                    <h1>💀 SYSTEM FAILURE 💀</h1>
                    <p class="final-score">Final Score: <span id="final-score">0</span></p>
                    <p class="high-score">High Score: <span id="final-high-score">0</span></p>
                    <button class="restart-btn" id="restart-btn">REBOOT SYSTEM</button>
                </div>
            </div>

            <!-- controls hint -->
            <div class="controls-hint">
                <span class="key">↑</span>
                <span class="key">↓</span>
                <span class="key">←</span>
                <span class="key">→</span>
                &nbsp;&nbsp;or&nbsp;&nbsp;
                <span class="key">W</span>
                <span class="key">A</span>
                <span class="key">S</span>
                <span class="key">D</span>
                &nbsp;&nbsp;|&nbsp;&nbsp;
                <span class="key">P</span> to pause
            </div>
        </div>
    </div>

    <!-- start screen -->
    <div class="start-screen" id="start-screen">
        <h1>SNAKES</h1>
        <h2>NEURAL GRID EDITION</h2>
        <div class="instructions">
            Consume the <span style="color:var(--green)">NEON NEXUS</span> to grow and score.<br>
            Avoid hitting the <span style="color:var(--magenta)">WALLS</span> and <span style="color:var(--cyan)">YOURSELF</span>.<br><br>
            Controls: <span class="key-hint">↑</span> <span class="key-hint">↓</span> <span class="key-hint">←</span> <span class="key-hint">→</span> or <span class="key-hint">W</span> <span class="key-hint">A</span> <span class="key-hint">S</span> <span class="key-hint">D</span><br>
            Pause: <span class="key-hint">P</span>
        </div>
        <button class="restart-btn" id="start-btn">INITIALIZE</button>
    </div>

    <script>
        // ============================================================================
        // SNAKES — NEURAL GRID EDITION
        // A retro-futuristic Snake game with cyberpunk aesthetics
        // ============================================================================

        // ======================== CONFIGURATION ========================
        const CONFIG = {
            canvasWidth: 500,
            canvasHeight: 500,
            gridSize: 25,
            cellSize: 20,
            baseSpeed: 150,
            speedIncrement: 8,
            minSpeed: 55,
            colors: {
                snakeHead: '#00ff41',
                snakeBody: '#00cc33',
                snakeHeadGlow: '#00ff41',
                food: '#ff00ff',
                foodGlow: '#ff00ff',
                grid: 'rgba(0, 255, 65, 0.08)',
                background: '#05050a'
            }
        };

        // ======================== MATRIX RAIN ========================
        class MatrixRain {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.columns = [];
                this.fontSize = 16;
                this.characters = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                this.init();
            }
            init() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                const numCols = Math.floor(this.canvas.width / this.fontSize);
                this.columns = Array(numCols).fill(0);
            }
            resize() { this.init(); }
            draw() {
                this.ctx.fillStyle = 'rgba(5, 5, 10, 0.15)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.font = this.fontSize + 'px monospace';
                this.ctx.fillStyle = '#00ff41';
                this.ctx.globalAlpha = 0.7;
                for (let i = 0; i < this.columns.length; i++) {
                    const text = this.characters[Math.floor(Math.random() * this.characters.length)];
                    const x = i * this.fontSize;
                    const y = this.columns[i] * this.fontSize;
                    this.ctx.fillText(text, x, y);
                    if (y > this.canvas.height && Math.random() > 0.975) this.columns[i] = 0;
                    this.columns[i]++;
                }
                this.ctx.globalAlpha = 1;
            }
        }

        // ======================== SNAKE GAME ========================
        class SnakeGame {
            constructor(canvas, config) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.config = config;
                this.snake = [];
                this.direction = { x: 1, y: 0 };
                this.nextDirection = { x: 1, y: 0 };
                this.food = null;
                this.score = 0;
                this.highScore = 0;
                this.level = 1;
                this.gameSpeed = config.baseSpeed;
                this.isRunning = false;
                this.isPaused = false;
                this.gameLoop = null;
                this.cols = config.gridSize;
                this.rows = config.gridSize;
                this.cellSize = config.cellSize;
                this.bindEvents();
                this.loadHighScore();
                this.init();
            }
            bindEvents() {
                document.addEventListener('keydown', (e) => this.handleInput(e));
            }
            handleInput(e) {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.code)) {
                    e.preventDefault();
                }
                if (e.code === 'KeyP') {
                    if (this.isRunning) this.togglePause();
                    return;
                }
                if (!this.isRunning) return;
                switch (e.code) {
                    case 'ArrowUp': case 'KeyW':
                        if (this.direction.y === 0) this.nextDirection = { x: 0, y: -1 };
                        break;
                    case 'ArrowDown': case 'KeyS':
                        if (this.direction.y === 0) this.nextDirection = { x: 0, y: 1 };
                        break;
                    case 'ArrowLeft': case 'KeyA':
                        if (this.direction.x === 0) this.nextDirection = { x: -1, y: 0 };
                        break;
                    case 'ArrowRight': case 'KeyD':
                        if (this.direction.x === 0) this.nextDirection = { x: 1, y: 0 };
                        break;
                }
            }
            togglePause() {
                this.isPaused = !this.isPaused;
                if (this.isPaused) {
                    clearInterval(this.gameLoop);
                    this.drawPauseMessage();
                } else {
                    this.gameLoop = setInterval(() => this.update(), this.gameSpeed);
                }
            }
            drawPauseMessage() {
                this.ctx.fillStyle = 'rgba(5, 5, 10, 0.85)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.fillStyle = '#00f0ff';
                this.ctx.font = 'bold 36px monospace';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText('SYSTEM PAUSED', this.canvas.width / 2, this.canvas.height / 2 - 20);
                this.ctx.fillStyle = '#ff00ff';
                this.ctx.font = '16px monospace';
                this.ctx.fillText('Press P to resume', this.canvas.width / 2, this.canvas.height / 2 + 20);
            }
            init() {
                this.canvas.width = this.config.canvasWidth;
                this.canvas.height = this.config.canvasHeight;
                const startX = Math.floor(this.cols / 2);
                const startY = Math.floor(this.rows / 2);
                this.snake = [
                    { x: startX, y: startY },
                    { x: startX - 1, y: startY },
                    { x: startX - 2, y: startY }
                ];
                this.direction = { x: 1, y: 0 };
                this.nextDirection = { x: 1, y: 0 };
                this.spawnFood();
                this.score = 0;
                this.level = 1;
                this.gameSpeed = this.config.baseSpeed;
                this.updateHUD();
                this.draw();
            }
            spawnFood() {
                let newPos;
                do {
                    newPos = {
                        x: Math.floor(Math.random() * this.cols),
                        y: Math.floor(Math.random() * this.rows)
                    };
                } while (this.snake.some(segment => segment.x === newPos.x && segment.y === newPos.y));
                this.food = newPos;
            }
            update() {
                if (this.isPaused) return;
                this.direction = this.nextDirection;
                const head = { ...this.snake[0] };
                head.x += this.direction.x;
                head.y += this.direction.y;
                if (head.x < 0 || head.x >= this.cols || head.y < 0 || head.y >= this.rows) {
                    this.gameOver();
                    return;
                }
                if (this.snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                    this.gameOver();
                    return;
                }
                this.snake.unshift(head);
                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += 10;
                    this.spawnFood();
                    this.gameSpeed = Math.max(this.config.minSpeed, this.gameSpeed - this.config.speedIncrement);
                    this.level = Math.floor((this.config.baseSpeed - this.gameSpeed) / this.config.speedIncrement) + 1;
                    clearInterval(this.gameLoop);
                    this.gameLoop = setInterval(() => this.update(), this.gameSpeed);
                } else {
                    this.snake.pop();
                }
                this.updateHUD();
                this.draw();
            }
            drawGrid() {
                this.ctx.strokeStyle = this.config.colors.grid;
                this.ctx.lineWidth = 1;
                for (let x = 0; x <= this.canvas.width; x += this.cellSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, this.canvas.height);
                    this.ctx.stroke();
                }
                for (let y = 0; y <= this.canvas.height; y += this.cellSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(this.canvas.width, y);
                    this.ctx.stroke();
                }
            }
            drawSnake() {
                for (let i = this.snake.length - 1; i >= 0; i--) {
                    const segment = this.snake[i];
                    const px = segment.x * this.cellSize;
                    const py = segment.y * this.cellSize;
                    if (i === 0) {
                        this.drawSegment(px, py, this.config.colors.snakeHead, this.config.colors.snakeHeadGlow, true);
                    } else {
                        const darkness = Math.min(0.5, i * 0.05);
                        const bodyColor = this.adjustBrightness(this.config.colors.snakeBody, -darkness * 50);
                        const bodyGlow = this.adjustBrightness(this.config.colors.snakeHeadGlow, -darkness * 50);
                        this.drawSegment(px, py, bodyColor, bodyGlow, false);
                    }
                }
            }
            drawSegment(x, y, color, glowColor, isHead) {
                const size = this.cellSize;
                const radius = isHead ? size * 0.4 : size * 0.35;
                this.ctx.save();
                this.ctx.shadowColor = glowColor;
                this.ctx.shadowBlur = isHead ? 8 : 5;
                this.ctx.fillStyle = color;
                this.roundRect(this.ctx, x + size * 0.1, y + size * 0.1, size * 0.8, size * 0.8, radius);
                this.ctx.fill();
                if (isHead) this.drawEyes(x, y, size);
                this.ctx.restore();
            }
            drawEyes(x, y, size) {
                const eyeSize = size * 0.12;
                const eyeOffset = size * 0.25;
                const eyeX1 = x + size * 0.3 - eyeSize / 2 + this.direction.x * eyeOffset * 0.3;
                const eyeY1 = y + size * 0.3 - eyeSize / 2 + this.direction.y * eyeOffset * 0.3;
                const eyeX2 = x + size * 0.7 - eyeSize / 2 + this.direction.x * eyeOffset * 0.3;
                const eyeY2 = y + size * 0.3 - eyeSize / 2 + this.direction.y * eyeOffset * 0.3;
                const pupilSize = eyeSize * 0.5;
                this.ctx.fillStyle = '#000000';
                this.ctx.fillRect(eyeX1, eyeY1, eyeSize, eyeSize);
                this.ctx.fillStyle = '#00ff41';
                this.ctx.fillRect(eyeX1 + eyeSize / 2 - pupilSize / 2 + this.direction.x * pupilSize, eyeY1 + eyeSize / 2 - pupilSize / 2 + this.direction.y * pupilSize, pupilSize, pupilSize);
                this.ctx.fillRect(eyeX2, eyeY2, eyeSize, eyeSize);
                this.ctx.fillStyle = '#00ff41';
                this.ctx.fillRect(eyeX2 + eyeSize / 2 - pupilSize / 2 + this.direction.x * pupilSize, eyeY2 + eyeSize / 2 - pupilSize / 2 + this.direction.y * pupilSize, pupilSize, pupilSize);
            }
            drawFood() {
                const x = this.food.x * this.cellSize;
                const y = this.food.y * this.cellSize;
                const size = this.cellSize;
                this.ctx.save();
                const pulse = Math.sin(Date.now() * 0.01) * 0.3 + 0.7;
                this.ctx.shadowColor = this.config.colors.foodGlow;
                this.ctx.shadowBlur = 15 * pulse;
                this.ctx.fillStyle = this.config.colors.food;
                this.roundRect(this.ctx, x + 4, y + 4, size - 8, size - 8, size * 0.3);
                this.ctx.fill();
                const time = Date.now() * 0.003;
                for (let i = 0; i < 4; i++) {
                    const angle = (i / 4) * Math.PI * 2 + time;
                    const radius = size * 0.3 + Math.sin(time * 2 + i) * 2;
                    const px = x + size / 2 + Math.cos(angle) * radius;
                    const py = y + size / 2 + Math.sin(angle) * radius;
                    this.ctx.beginPath();
                    this.ctx.arc(px, py, 2, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                this.ctx.restore();
            }
            draw() {
                this.ctx.fillStyle = this.config.colors.background;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                this.drawGrid();
                this.drawNeonBorder();
                this.drawFood();
                this.drawSnake();
            }
            drawNeonBorder() {
                this.ctx.save();
                this.ctx.strokeStyle = '#ff00ff';
                this.ctx.shadowColor = '#ff00ff';
                this.ctx.shadowBlur = 10;
                this.ctx.lineWidth = 2;
                this.ctx.strokeRect(1, 1, this.canvas.width - 2, this.canvas.height - 2);
                this.ctx.restore();
            }
            roundRect(ctx, x, y, width, height, radius) {
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
            }
            adjustBrightness(hex, percent) {
                const R = parseInt(hex.substr(1, 2), 16);
                const G = parseInt(hex.substr(3, 2), 16);
                const B = parseInt(hex.substr(5, 2), 16);
                const newR = Math.min(255, Math.max(0, R + percent));
                const newG = Math.min(255, Math.max(0, G + percent));
                const newB = Math.min(255, Math.max(0, B + percent));
                return `rgb(${newR}, ${newG}, ${newB})`;
            }
            updateHUD() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('high-score').textContent = this.highScore;
                document.getElementById('level').textContent = this.level;
            }
            loadHighScore() {
                const stored = localStorage.getItem('neuralSnakeHighScore');
                this.highScore = stored ? parseInt(stored) : 0;
            }
            saveHighScore() {
                localStorage.setItem('neuralSnakeHighScore', this.highScore.toString());
            }
            startGame() {
                document.getElementById('start-screen').classList.remove('show');
                this.init();
                this.isRunning = true;
                this.isPaused = false;
                this.gameLoop = setInterval(() => this.update(), this.gameSpeed);
            }
            gameOver() {
                this.isRunning = false;
                clearInterval(this.gameLoop);
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    this.saveHighScore();
                }
                const gameOverScreen = document.getElementById('game-over');
                gameOverScreen.classList.add('show');
                document.getElementById('final-score').textContent = this.score;
                document.getElementById('final-high-score').textContent = this.highScore;
                this.draw();
            }
            restart() {
                document.getElementById('game-over').classList.remove('show');
                this.startGame();
            }
        }

        // ======================== GLITCH EFFECT ========================
        class GlitchEffect {
            constructor() {
                this.overlay = document.getElementById('glitch-overlay');
                this.isGlitching = false;
                this.glitchInterval = null;
            }
            start() {
                this.overlay.style.cssText = `
                    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                    pointer-events: none; z-index: 5; mix-blend-mode: screen;
                    opacity: 0; transition: opacity 0.1s;
                `;
            }
            trigger() {
                if (this.isGlitching) return;
                this.isGlitching = true;
                const glitches = Math.floor(Math.random() * 3) + 1;
                for (let i = 0; i < glitches; i++) {
                    setTimeout(() => this.doGlitch(), i * 150);
                }
                setTimeout(() => { this.isGlitching = false; }, glitches * 150 + 200);
            }
            doGlitch() {
                const intensity = Math.random() * 0.7 + 0.3;
                const translateX = (Math.random() - 0.5) * 10 * intensity;
                const scaleX = 1 + (Math.random() - 0.5) * 0.2 * intensity;
                const hueRotate = Math.random() * 360;
                this.overlay.style.cssText += `
                    background: repeating-linear-gradient(
                        0deg, rgba(0,255,65,0.3), rgba(0,255,65,0.3) ${5 * intensity}px,
                        transparent ${5 * intensity}px, transparent ${10 * intensity}px
                    );
                    transform: translateX(${translateX}px) scaleX(${scaleX});
                    filter: hue-rotate(${hueRotate}deg);
                    opacity: 0.3;
                `;
                setTimeout(() => {
                    this.overlay.style.opacity = '0';
                    this.overlay.style.transform = 'translateX(0) scaleX(1)';
                    this.overlay.style.filter = 'none';
                }, 100);
            }
        }

        // ======================== INITIALIZATION ========================
        const gameCanvas = document.getElementById('game-canvas');
        const matrixCanvas = document.getElementById('matrix');

        const matrixRain = new MatrixRain(matrixCanvas);
        window.addEventListener('resize', () => { matrixRain.resize(); });

        function animateMatrix() {
            matrixRain.draw();
            requestAnimationFrame(animateMatrix);
        }
        animateMatrix();

        gameCanvas.width = CONFIG.canvasWidth;
        gameCanvas.height = CONFIG.canvasHeight;

        const game = new SnakeGame(gameCanvas, CONFIG);

        const glitch = new GlitchEffect();
        glitch.start();

        setInterval(() => {
            if (Math.random() > 0.7 && !game.isPaused && game.isRunning) {
                glitch.trigger();
            }
        }, 2000);

        document.getElementById('start-btn').addEventListener('click', () => {
            game.startGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            game.restart();
        });

        document.getElementById('start-screen').addEventListener('click', () => {
            if (!game.isRunning) game.startGame();
        });

        document.addEventListener('keydown', (e) => {
            if (!game.isRunning && !document.getElementById('start-screen').classList.contains('hidden')) {
                game.startGame();
            }
        });
    </script>
