<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER SNAKE // MATRIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#00ff41;font-family:'Courier New',monospace;overflow:hidden}
#matrix{position:fixed;inset:0;z-index:1;display:block}
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:10;background:repeating-linear-gradient(0deg,rgba(0,0,0,.15),rgba(0,0,0,.15)1px,transparent 1px,transparent 3px);mix-blend-mode:overlay}
.game-container{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:20px}
.hud{display:flex;gap:40px;margin-bottom:16px;font-size:1.1rem;text-transform:uppercase;letter-spacing:.12em;text-shadow:0 0 6px #00ff41,0 0 18px #00ff41}
.hud-item{color:#00ff41}
.hud-item span{color:#00ffff;text-shadow:0 0 6px #00ffff}
.game-wrapper{position:relative}
#game{background:#020202;border:2px solid #00ff41;box-shadow:0 0 30px #00ff41,0 0 60px rgba(0,255,65,.15),inset 0 0 20px rgba(0,255,65,.08);image-rendering:pixelated}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.88);backdrop-filter:blur(2px);text-align:center;padding:20px}
.overlay h1{font-size:3rem;margin-bottom:10px;letter-spacing:.2em;text-transform:uppercase;color:#ff00ff;text-shadow:0 0 10px #ff00ff,0 0 30px #ff00ff}
.overlay p{color:#0f0;margin:6px 0;opacity:.9}
.overlay .btn{margin-top:20px;padding:10px 24px;border:1px solid #00ff41;background:transparent;color:#00ff41;text-transform:uppercase;letter-spacing:.15em;cursor:pointer;text-shadow:0 0 8px #00ff41}
.overlay .btn:hover{background:rgba(0,255,65,.1);box-shadow:0 0 20px #00ff41 inset}
.controls{margin-top:14px;font-size:.85rem;color:#0a0;opacity:.7;letter-spacing:.08em}
.glitch{position:relative}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;clip-path:inset(0);opacity:.7}
.glitch::before{transform:translate(2px,0);color:#00ffff;mix-blend-mode:screen;animation:glitch1 2.5s infinite}
.glitch::after{transform:translate(-2px,0);color:#ff00ff;mix-blend-mode:screen;animation:glitch2 3s infinite}
@keyframes glitch1{0%{clip-path:inset(10% 0 80% 0)}20%{clip-path:inset(60% 0 10% 0)}40%{clip-path:inset(30% 0 50% 0)}100%{clip-path:inset(0 0 0 0)}}
@keyframes glitch2{0%{clip-path:inset(80% 0 10% 0)}20%{clip-path:inset(10% 0 60% 0)}40%{clip-path:inset(50% 0 30% 0)}100%{clip-path:inset(0 0 0 0)}}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="scanlines"></div>
<div class="game-container">
  <div class="hud">
    <div class="hud-item">SCORE: <span id="score">0</span></div>
    <div class="hud-item">HIGH: <span id="highscore">0</span></div>
  </div>
  <div class="game-wrapper">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h1 class="glitch" data-text="CYBER SNAKE">CYBER SNAKE</h1>
      <p>// SYSTEM BOOTING</p>
      <p>USE ARROW KEYS / WASD TO NAVIGATE</p>
      <p>EAT NEON NODES • AVOID COLLISION</p>
      <button class="btn" id="startBtn">INIT SEQUENCE</button>
    </div>
  </div>
  <div class="controls">CYBERPUNK EDITION • MADE WITH VANILLA JS</div>
</div>
<script>
(() => {
  // ===== MATRIX RAIN BACKGROUND =====
  const matrixCanvas = document.getElementById('matrix');
  const mctx = matrixCanvas.getContext('2d');
  let mW, mH, fontSize = 16, cols, drops;
  const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ$@%#&*';
  function resizeMatrix(){
    mW = matrixCanvas.width = window.innerWidth;
    mH = matrixCanvas.height = window.innerHeight;
    cols = Math.floor(mW / fontSize);
    drops = Array(cols).fill(0).map(()=>Math.random()*mH/fontSize);
  }
  function drawMatrix(){
    mctx.fillStyle = 'rgba(0,0,0,0.08)';
    mctx.fillRect(0,0,mW,mH);
    mctx.fillStyle = '#0f0';
    mctx.font = fontSize+'px monospace';
    for(let i=0;i<cols;i++){
      const ch = chars[Math.floor(Math.random()*chars.length)];
      const y = drops[i]*fontSize;
      mctx.fillText(ch, i*fontSize, y);
      if(y > mH && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  function matrixLoop(){ drawMatrix(); requestAnimationFrame(matrixLoop); }
  window.addEventListener('resize', resizeMatrix);
  resizeMatrix(); matrixLoop();

// ===== SNAKE GAME =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 24;
let cellSize = 20;
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const highEl = document.getElementById('highscore');
const startBtn = document.getElementById('startBtn');

let snake, dir, nextDir, food, score, highScore, state, tickInterval, lastTime, accumulator;

function resizeGame(){
const max = Math.min(window.innerWidth0.9, window.innerHeight0.65);
cellSize = Math.floor(max / GRID);
canvas.width = GRIDcellSize;
canvas.height = GRIDcellSize;
canvas.style.width = canvas.width+'px';
canvas.style.height = canvas.height+'px';
}
window.addEventListener('resize', resizeGame);
resizeGame();

function loadHigh(){ try{ highScore = parseInt(localStorage.getItem('cyberSnakeHigh')||'0'); }catch(e){ highScore=0; } highEl.textContent = highScore; }
function saveHigh(){ try{ localStorage.setItem('cyberSnakeHigh', highScore); }catch(e){} }

function reset(){
snake = [{x:12,y:12},{x:11,y:12},{x:10,y:12},{x:9,y:12}];
dir = {x:1,y:0}; nextDir = {...dir};
score = 0; scoreEl.textContent = '0';
spawnFood();
tickInterval = 140;
state = 'playing';
overlay.style.display = 'none';
}

function spawnFood(){
let pos;
do{
pos = {x:Math.floor(Math.random()*GRID), y:Math.floor(Math.random()*GRID)};
}while(snake.some(s=>s.x===pos.x && s.y===pos.y));
food = pos;
}

function update(){
dir = {...nextDir};
const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
// wall collision
if(head.x<0||head.y<0||head.x>=GRID||head.y>=GRID){ gameOver(); return; }
// self collision
if(snake.some(s=>s.x===head.x && s.y===head.y)){ gameOver(); return; }
snake.unshift(head);
if(head.x===food.x && head.y===food.y){
score += 10; scoreEl.textContent = score;
spawnFood();
// increase difficulty
tickInterval = Math.max(60, 140 - snake.length*2.5);
if(score > highScore){ highScore = score; highEl.textContent = highScore; saveHigh(); }
}else{
snake.pop();
}
}

function render(){
ctx.fillStyle = '#020202';
ctx.fillRect(0,0,canvas.width,canvas.height);
// grid
ctx.strokeStyle = 'rgba(0,255,65,0.06)';
ctx.lineWidth = 1;
for(let i=0;i<=GRID;i++){
ctx.beginPath();
ctx.moveTo(icellSize,0); ctx.lineTo(icellSize,canvas.height);
ctx.moveTo(0,icellSize); ctx.lineTo(canvas.width,icellSize);
ctx.stroke();
}
// food
ctx.save();
ctx.shadowBlur = 20;
ctx.shadowColor = '#ff00ff';
ctx.fillStyle = '#ff00ff';
ctx.fillRect(food.xcellSize+4, food.ycellSize+4, cellSize-8, cellSize-8);
ctx.restore();
// snake
snake.forEach((seg,i)=>{
ctx.save();
ctx.shadowBlur = 12;
ctx.shadowColor = i===0 ? '#00ffff' : '#00ff41';
ctx.fillStyle = i===0 ? '#00ffff' : '#00ff41';
ctx.fillRect(seg.xcellSize+2, seg.ycellSize+2, cellSize-4, cellSize-4);
ctx.restore();
});
}

function gameOver(){
state = 'over';
overlay.innerHTML = <h1 class="glitch" data-text="SYSTEM FAILURE">SYSTEM FAILURE</h1> <p>SCORE: ${score}</p> <p>HIGH SCORE: ${highScore}</p> <p>// PRESS SPACE OR CLICK TO REBOOT</p> <button class="btn" id="restartBtn">REBOOT</button>;
overlay.style.display = 'flex';
document.getElementById('restartBtn').onclick = startGame;
}

function startGame(){
loadHigh();
reset();
lastTime = performance.now();
accumulator = 0;
requestAnimationFrame(loop);
}

function loop(now){
const delta = now - lastTime;
lastTime = now;
if(state==='playing'){
accumulator += delta;
while(accumulator >= tickInterval){
update();
accumulator -= tickInterval;
}
}
render();
requestAnimationFrame(loop);
}

// Controls
window.addEventListener('keydown', e=>{
const k = e.key.toLowerCase();
let nd = {x:0,y:0};
if(k==='arrowup'||k==='w') nd = {x:0,y:-1};
else if(k==='arrowdown'||k==='s') nd = {x:0,y:1};
else if(k==='arrowleft'||k==='a') nd = {x:-1,y:0};
else if(k==='arrowright'||k==='d') nd = {x:1,y:0};
else if(k===' '){ if(state!=='playing') startGame(); return; }
// prevent reverse
if(nd.x===-dir.x && nd.y===-dir.y) return;
if(nd.x||nd.y) nextDir = nd;
});

startBtn.onclick = startGame;
loadHigh();
})();
</script>

</body>
</html>
