<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON SNAKE // TERMINAL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f0;font-family:'Share Tech Mono',monospace;overflow:hidden;height:100vh;display:flex;justify-content:center;align-items:center}
#wrap{position:relative;width:100%;max-width:600px;padding:10px}
#matrix{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;opacity:.15}
#gameArea{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px}
#hud{display:flex;justify-content:space-between;width:100%;font-size:14px;text-shadow:0 0 8px #0f0;letter-spacing:1px}
#hud span{color:#0ff}
#scoreBox{border:1px solid #0f0;padding:4px 12px;box-shadow:0 0 10px #0f0 inset,0 0 10px #0f0}
#highBox{border:1px solid #f0f;padding:4px 12px;box-shadow:0 0 10px #f0f inset,0 0 10px #f0f}
#canvasWrap{position:relative;border:2px solid #0f0;box-shadow:0 0 20px #0f0,0 0 40px #0f044,inset 0 0 20px #0f022;border-radius:4px;overflow:hidden}
canvas{display:block;background:#000;image-rendering:pixelated}
#scanlines{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,255,0,.03) 0px,rgba(0,255,0,.03) 1px,transparent 1px,transparent:3px);z-index:2}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;z-index:3;background:rgba(0,0,0,.85);backdrop-filter:blur(2px);text-align:center;padding:20px}
#overlay.hidden{display:none}
h1{font-family:'Orbitron',sans-serif;font-size:36px;color:#0f0;text-shadow:0 0 10px #0f0,0 0 20px #0f0,0 0 30px #0f0;letter-spacing:4px;animation:glitch 3s infinite}
@keyframes glitch{0%,100%{transform:translate(0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,1px)}80%{transform:translate(1px,-1px)}}
#msg{font-size:22px;color:#0ff;text-shadow:0 0 8px #0ff;letter-spacing:2px}
#finalScore{font-size:48px;color:#f0f;text-shadow:0 0 15px #f0f,0 0 30px #f0f;font-family:'Orbitron',sans-serif}
#startBtn{margin-top:10px;padding:12px 32px;background:#000;color:#0f0;border:2px solid #0f0;font-family:'Orbitron',sans-serif;font-size:16px;letter-spacing:3px;cursor:pointer;text-shadow:0 0 10px #0f0;box-shadow:0 0 15px #0f044,inset 0 0 10px #0f022;transition:all .2s}
#startBtn:hover{background:#0f0;color:#000;box-shadow:0 0 25px #0f0,inset 0 0 15px #0f0}
#controls{font-size:12px;color:#0aa;letter-spacing:1px;text-align:center;line-height:1.8}
#controls kbd{background:#111;border:1px solid #0f0;padding:1px 6px;border-radius:3px;color:#0f0;text-shadow:0 0 5px #0f0}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div id="gameArea">
<div id="hud"><div id="scoreBox">SCORE: <span id="score">0</span></div><div id="highBox">HIGH: <span id="high">0</span></div></div>
<div id="canvasWrap"><canvas id="game"></canvas><div id="scanlines"></div><div id="overlay"><h1>NEON SNAKE</h1><div id="msg">INITIALIZE SYSTEM</div><div id="finalScore" style="display:none"></div><button id="startBtn">[ START ]</button><div id="controls">WASD / ARROWS TO MOVE &nbsp;|&nbsp; P TO PAUSE &nbsp;|&nbsp; Q TO QUIT</div></div></div>
</div>
<script>
// ===== MATRIX DIGITAL RAIN =====
const mc = document.getElementById('matrix');
const mctx = mc.getContext('2d');
let cols, drops;
const glyphs = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
function initMatrix(){
  mc.width = window.innerWidth;
  mc.height = window.innerHeight;
  cols = Math.floor(mc.width / 14);
  drops = Array(cols).fill(0).map(()=>Math.floor(Math.random()*-50));
}
function drawMatrix(){
  mctx.fillStyle = 'rgba(0,0,0,0.05)';
  mctx.fillRect(0,0,mc.width,mc.height);
  mctx.font = '14px monospace';
  for(let i=0;i<cols;i++){
    const t = drops[i];
    const ch = glyphs[Math.floor(Math.random()*glyphs.length)];
    const x = i*14;
    const y = t*14;
    mctx.fillStyle = '#0f0';
    mctx.globalAlpha = 0.3;
    mctx.fillText(ch, x, y);
    mctx.fillStyle = '#0ff';
    mctx.globalAlpha = 0.9;
    mctx.fillText(ch, x, y);
    if(y > mc.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
  mctx.globalAlpha = 1;
}
initMatrix();
window.addEventListener('resize', initMatrix);
setInterval(drawMatrix, 60);
// ===== GAME STATE =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highEl = document.getElementById('high');
const overlay = document.getElementById('overlay');
const msgEl = document.getElementById('msg');
const finalEl = document.getElementById('finalScore');
const startBtn = document.getElementById('startBtn');

let CELL = 20;
let GRID_W, GRID_H;
let snake, dir, nextDir, food, score, high, speed, tickMs, last, running, paused, gameOver;

high = parseInt(localStorage.getItem('neonSnakeHigh') || '0');
highEl.textContent = high;

function resize(){
  const wrap = document.getElementById('canvasWrap');
  const maxW = Math.min(wrap.clientWidth - 4, 560);
  const maxH = Math.min(window.innerHeight - 220, 560);
  const size = Math.max(16, Math.floor(Math.min(maxW, maxH) / 20) * 20);
  canvas.width = size;
  canvas.height = size;
  GRID_W = Math.floor(canvas.width / CELL);
  GRID_H = Math.floor(canvas.height / CELL);
}
window.addEventListener('resize', resize);
resize();

function reset(){
  snake = [{x:Math.floor(GRID_W/2),y:Math.floor(GRID_H/2)}];
  dir = {x:1, y:0};
  nextDir = {x:1, y:0};
  score = 0;
  speed = 7;
  tickMs = 140;
  last = 0;
  running = false;
  paused = false;
  gameOver = false;
  scoreEl.textContent = '0';
  placeFood();
}

function placeFood(){
  let p;
  do {
    p = {x:Math.floor(Math.random()*GRID_W), y:Math.floor(Math.random()*GRID_H)};
  } while(snake.some(s=>s.x===p.x && s.y===p.y));
  food = p;
}

function step(){
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if(head.x<0||head.x>=GRID_W||head.y<0||head.y>=GRID_H){ endGame(); return; }
  if(snake.some(s=>s.x===head.x && s.y===head.y)){ endGame(); return; }
  snake.unshift(head);
  if(head.x===food.x && head.y===food.y){
    score += 10;
    scoreEl.textContent = score;
    if(score > high){
      high = score;
      highEl.textContent = high;
      localStorage.setItem('neonSnakeHigh', high);
    }
    placeFood();
    if(score % 50 === 0){ speed++; tickMs = Math.max(60, tickMs - 8); }
  } else {
    snake.pop();
  }
}

function draw(){
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // grid
  ctx.strokeStyle = 'rgba(0,255,0,0.05)';
  ctx.lineWidth = 1;
  for(let i=1;i<GRID_W;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke();}
  for(let i=1;i<GRID_H;i++){ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(canvas.width,i*CELL);ctx.stroke();}
  // food
  const fx = food.x*CELL, fy = food.y*CELL;
  ctx.fillStyle = '#f0f';
  ctx.shadowColor = '#f0f'; ctx.shadowBlur = 15;
  ctx.fillRect(fx+2, fy+2, CELL-4, CELL-4);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ff0';
  ctx.fillRect(fx+CELL/2-2, fy+CELL/2-2, 4, 4);
  // snake
  snake.forEach((s,i)=>{
    const t = i / snake.length;
    ctx.fillStyle = i===0 ? '#0ff' : `hsl(${120 - t*40}, 100%, ${60 - t*20}%)`;
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
    ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
    ctx.shadowBlur = 0;
    if(i===0){
      ctx.fillStyle = '#fff';
      ctx.fillRect(s.x*CELL+4, s.y*CELL+4, 4, 4);
      ctx.fillRect(s.x*CELL+CELL-8, s.y*CELL+4, 4, 4);
    }
  });
}

function loop(t){
  if(running && !paused && !gameOver){
    if(t - last > tickMs){ step(); last = t; }
  }
  draw();
  requestAnimationFrame(loop);
}

function endGame(){
  gameOver = true;
  running = false;
  finalEl.style.display = 'block';
  finalEl.textContent = 'SCORE: ' + score;
  msgEl.textContent = 'SYSTEM FAILURE';
  msgEl.style.color = '#f0f';
  msgEl.style.textShadow = '0 0 8px #f0f';
  startBtn.textContent = '[ REBOOT ]';
  overlay.classList.remove('hidden');
}

function start(){
  reset();
  running = true;
  overlay.classList.add('hidden');
  msgEl.style.color = '#0ff';
  msgEl.style.textShadow = '0 0 8px #0ff';
}

startBtn.addEventListener('click', start);

// ===== INPUT =====
const keyMap = {
  ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1},
  ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
  w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0},
  W:{x:0,y:-1}, S:{x:0,y:1}, A:{x:-1,y:0}, D:{x:1,y:0}
};
window.addEventListener('keydown', e=>{
  const k = e.key;
  if(k==='p'||k==='P'){ if(running){paused=!paused; msgEl.textContent=paused?'PAUSED':'';} return; }
  if(k==='q'||k==='Q'){ if(running){endGame();} return; }
  if(keyMap[k]){
    e.preventDefault();
    const nd = keyMap[k];
    if(!(nd.x===-dir.x && nd.y===-dir.y)) nextDir = nd;
    if(!running) start();
  }
});

requestAnimationFrame(loop);
</script>
</body>
</html>
