<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_SNAKE // v4.7</title>
    <style>
        /* ============================================
           CYBERPUNK / MATRIX AESTHETIC STYLES
           ============================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Matrix Digital Rain Background */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.3;
        }

        /* Scanline Overlay Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
        }

        /* Main Game Container */
        .game-container {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        /* Header / Title */
        .game-header {
            margin-bottom: 15px;
            text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
        }

        .game-header h1 {
            font-size: 2.5rem;
            letter-spacing: 5px;
            color: #00ff41;
            text-transform: uppercase;
            animation: glitch 3s infinite;
        }

        .game-header .subtitle {
            font-size: 0.9rem;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
            letter-spacing: 3px;
        }

        /* Score Display */
        .score-board {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .score-item {
            padding: 8px 15px;
            border: 1px solid #00ff41;
            border-radius: 3px;
            background: rgba(0, 255, 65, 0.1);
            text-shadow: 0 0 5px #00ff41;
        }

        .score-item .label {
            color: #00ffff;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-item .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff41;
        }

        /* Game Canvas */
        #game-canvas {
            border: 2px solid #00ff41;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5), inset 0 0 15px rgba(0, 255, 65, 0.1);
            background: rgba(0, 10, 0, 0.9);
            display: block;
            margin: 0 auto;
        }

        /* Game Over Screen */
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #ff0055;
            padding: 30px 40px;
            text-align: center;
            z-index: 10;
            display: none;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
        }

        .game-over h2 {
            color: #ff0055;
            font-size: 2rem;
            text-shadow: 0 0 10px #ff0055;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .game-over .final-score {
            color: #00ffff;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .game-over .high-score {
            color: #ff00ff;
            font-size: 1rem;
            margin-bottom: 20px;
            text-shadow: 0 0 5px #ff00ff;
        }

        .restart-btn {
            background: transparent;
            border: 2px solid #00ff41;
            color: #00ff41;
            padding: 10px 25px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            text-shadow: 0 0 5px #00ff41;
        }

        .restart-btn:hover {
            background: #00ff41;
            color: #000;
            box-shadow: 0 0 15px #00ff41;
        }

        /* Controls Info */
        .controls-info {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #888;
            letter-spacing: 1px;
        }

        .controls-info span {
            color: #00ffff;
            text-shadow: 0 0 3px #00ffff;
        }

        /* Glitch Animation */
        @keyframes glitch {
            0%, 90%, 100% {
                transform: translate(0);
                text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
            }
            92% {
                transform: translate(-2px, 1px);
                text-shadow: 2px 0 #ff0055, -2px 0 #00ffff;
            }
            94% {
                transform: translate(2px, -1px);
                text-shadow: -2px 0 #ff0055, 2px 0 #00ffff;
            }
            96% {
                transform: translate(-1px, -1px);
                text-shadow: 1px 0 #ff0055, -1px 0 #00ffff;
            }
            98% {
                transform: translate(1px, 1px);
                text-shadow: -1px 0 #ff0055, 1px 0 #00ffff;
            }
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .game-header h1 {
                font-size: 1.8rem;
            }
            
            .score-board {
                gap: 15px;
            }
            
            .score-item .value {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Matrix Digital Rain Background -->
    <canvas id="matrix-canvas"></canvas>
    
    <!-- Scanline Overlay -->
    <div class="scanlines"></div>
    
    <!-- Main Game Container -->
    <div class="game-container">
        <div class="game-header">
            <h1>CYBER_SNAKE</h1>
            <div class="subtitle">// SYSTEM ONLINE // NEURAL LINK ACTIVE //</div>
        </div>
        
        <div class="score-board">
            <div class="score-item">
                <div class="label">SCORE</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="label">HIGH SCORE</div>
                <div class="value" id="high-score">0</div>
            </div>
        </div>
        
        <canvas id="game-canvas" width="400" height="400"></canvas>
        
        <div class="controls-info">
            CONTROLS: <span>ARROW KEYS</span> or <span>WASD</span> | <span>P</span> = PAUSE
        </div>
        
        <!-- Game Over Screen -->
        <div class="game-over" id="game-over">
            <h2>SYSTEM FAILURE</h2>
            <div class="final-score">FINAL SCORE: <span id="final-score">0</span></div>
            <div class="high-score">HIGH SCORE: <span id="final-high-score">0</span></div>
            <button class="restart-btn" id="restart-btn">REBOOT SYSTEM</button>
        </div>
    </div>

    <script>
        /* ============================================
           CYBERPUNK SNAKE GAME - MAIN LOGIC
           ============================================ */

        // ----------------------------
        // MATRIX DIGITAL RAIN EFFECT
        // ----------------------------
        const matrixCanvas = document.getElementById('matrix-canvas');
        const matrixCtx = matrixCanvas.getContext('2d');

        // Resize canvas to fit window
        function resizeMatrixCanvas() {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
        }
        resizeMatrixCanvas();
        window.addEventListener('resize', resizeMatrixCanvas);

        // Matrix rain characters
        const matrixChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*()_+-=[]{}|;:,.<>?';
        const fontSize = 14;
        const columns = Math.floor(matrixCanvas.width / fontSize);
        const drops = new Array(columns).fill(1);

        function drawMatrixRain() {
            // Semi-transparent black to create fade effect
            matrixCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);

            matrixCtx.fillStyle = '#00ff41';
            matrixCtx.font = fontSize + 'px Courier New';

            for (let i = 0; i < drops.length; i++) {
                const char = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                matrixCtx.fillText(char, i * fontSize, drops[i] * fontSize);

                // Reset drop randomly or when it goes off screen
                if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        // ----------------------------
        // SNAKE GAME LOGIC
        // ----------------------------
        const gameCanvas = document.getElementById('game-canvas');
        const gameCtx = gameCanvas.getContext('2d');

        // Game constants
        const GRID_SIZE = 20;
        const TILE_COUNT = gameCanvas.width / GRID_SIZE;
        
        // Game state
        let snake = [];
        let food = {};
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('cyberSnakeHighScore')) || 0;
        let gameRunning = true;
        let gamePaused = false;
        let speed = 150; // Initial speed in ms
        let lastRenderTime = 0;
        let animationId = null;

        // Initialize high score display
        document.getElementById('high-score').textContent = highScore;

        // Initialize game
        function initGame() {
            // Start snake in the middle
            snake = [
                { x: Math.floor(TILE_COUNT / 2), y: Math.floor(TILE_COUNT / 2) },
                { x: Math.floor(TILE_COUNT / 2) - 1, y: Math.floor(TILE_COUNT / 2) },
                { x: Math.floor(TILE_COUNT / 2) - 2, y: Math.floor(TILE_COUNT / 2) }
            ];
            
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            speed = 150;
            gameRunning = true;
            gamePaused = false;
            
            document.getElementById('score').textContent = score;
            document.getElementById('game-over').style.display = 'none';
            
            placeFood();
            
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            requestAnimationFrame(gameLoop);
        }

        // Place food at random position
        function placeFood() {
            let validPosition = false;
            while (!validPosition) {
                food = {
                    x: Math.floor(Math.random() * TILE_COUNT),
                    y: Math.floor(Math.random() * TILE_COUNT)
                };
                
                // Make sure food doesn't spawn on snake
                validPosition = !snake.some(segment => 
                    segment.x === food.x && segment.y === food.y
                );
            }
        }

        // Update game state
        function update() {
            if (!gameRunning || gamePaused) return;

            // Update direction
            direction = { ...nextDirection };

            // Calculate new head position
            const head = { 
                x: snake[0].x + direction.x, 
                y: snake[0].y + direction.y 
            };

            // Check wall collision (wrap-around)
            if (head.x < 0) head.x = TILE_COUNT - 1;
            if (head.x >= TILE_COUNT) head.x = 0;
            if (head.y < 0) head.y = TILE_COUNT - 1;
            if (head.y >= TILE_COUNT) head.y = 0;

            // Check self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            // Add new head
            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                
                // Increase difficulty: speed up every 50 points
                if (score % 50 === 0 && speed > 50) {
                    speed -= 10;
                }
                
                placeFood();
            } else {
                // Remove tail if no food eaten
                snake.pop();
            }
        }

        // Render game
        function render() {
            // Clear canvas with dark background
            gameCtx.fillStyle = 'rgba(0, 10, 0, 0.95)';
            gameCtx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

            // Draw grid (subtle)
            gameCtx.strokeStyle = 'rgba(0, 255, 65, 0.05)';
            gameCtx.lineWidth = 0.5;
            for (let i = 0; i < TILE_COUNT; i++) {
                gameCtx.beginPath();
                gameCtx.moveTo(i * GRID_SIZE, 0);
                gameCtx.lineTo(i * GRID_SIZE, gameCanvas.height);
                gameCtx.stroke();
                gameCtx.beginPath();
                gameCtx.moveTo(0, i * GRID_SIZE);
                gameCtx.lineTo(gameCanvas.width, i * GRID_SIZE);
                gameCtx.stroke();
            }

            // Draw food with glow effect
            gameCtx.fillStyle = '#ff0055';
            gameCtx.shadowColor = '#ff0055';
            gameCtx.shadowBlur = 15;
            gameCtx.fillRect(
                food.x * GRID_SIZE + 2,
                food.y * GRID_SIZE + 2,
                GRID_SIZE - 4,
                GRID_SIZE - 4
            );
            gameCtx.shadowBlur = 0;

            // Draw snake
            snake.forEach((segment, index) => {
                // Head is brighter, body fades slightly
                const alpha = index === 0 ? 1 : 0.8 - (index / snake.length) * 0.3;
                
                if (index === 0) {
                    // Snake head - bright cyan
                    gameCtx.fillStyle = '#00ffff';
                    gameCtx.shadowColor = '#00ffff';
                    gameCtx.shadowBlur = 10;
                } else {
                    // Snake body - green with varying opacity
                    gameCtx.fillStyle = `rgba(0, 255, 65, ${alpha})`;
                    gameCtx.shadowColor = '#00ff41';
                    gameCtx.shadowBlur = 5;
                }
                
                gameCtx.fillRect(
                    segment.x * GRID_SIZE + 1,
                    segment.y * GRID_SIZE + 1,
                    GRID_SIZE - 2,
                    GRID_SIZE - 2
                );
            });
            
            // Reset shadow
            gameCtx.shadowBlur = 0;
        }

        // Game loop
        function gameLoop(currentTime) {
            if (!gameRunning) return;

            animationId = requestAnimationFrame(gameLoop);

            // Control game speed
            if (currentTime - lastRenderTime < speed) return;
            lastRenderTime = currentTime;

            update();
            render();
        }

        // Game over
        function gameOver() {
            gameRunning = false;
            
            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('cyberSnakeHighScore', highScore);
                document.getElementById('high-score').textContent = highScore;
            }
            
            // Show game over screen
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-high-score').textContent = highScore;
            document.getElementById('game-over').style.display = 'block';
        }

        // ----------------------------
        // INPUT HANDLING
        // ----------------------------
        document.addEventListener('keydown', (e) => {
            // Prevent default arrow key scrolling
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }

            // Pause/Unpause with P key
            if (e.key.toLowerCase() === 'p') {
                gamePaused = !gamePaused;
                return;
            }

            // Don't process input if game is paused or over
            if (!gameRunning || gamePaused) return;

            // Arrow keys and WASD controls
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        });

        // Restart button
        document.getElementById('restart-btn').addEventListener('click', initGame);

        // ----------------------------
        // INITIALIZATION
        // ----------------------------
        
        // Start matrix rain animation
        function matrixLoop() {
            drawMatrixRain();
            requestAnimationFrame(matrixLoop);
        }
        matrixLoop();

        // Start the game
        initGame();
    </script>
</body>
</html>
