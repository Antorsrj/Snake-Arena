<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SNAKE.EXE // NEURAL GRID</title>
<style>
  /* ============================================================
     THEME TOKENS
     ============================================================ */
  :root{
    --green:#39ff14;
    --cyan:#00fff7;
    --magenta:#ff00e0;
    --amber:#ffb000;
    --red:#ff2d55;
    --bg:#03060a;
    --text:#c8ffe0;

    /* Futuristic display stack -> falls back to the nearest monospace
       actually installed. No webfonts are loaded (zero dependencies). */
    --font:"Orbitron","Rajdhani","Share Tech Mono","Rajdhani",ui-monospace,
           "SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(120% 90% at 50% -10%, #06141a 0%, #040a0f 48%, #010304 100%);
    color:var(--text);
    font-family:var(--font);
    letter-spacing:.06em;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ============================================================
     BACKGROUND LAYERS : matrix rain / scanlines / vignette
     ============================================================ */
  #matrix{
    position:fixed; inset:0; z-index:0;
    opacity:.5;
    filter:saturate(1.15) contrast(1.05);
  }
  .scanlines{
    position:fixed; inset:0; z-index:3; pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,.30) 0 1px,
      rgba(0,0,0,0) 1px 3px);
    opacity:.55;
  }
  .scanbar{
    position:fixed; left:0; right:0; height:150px; z-index:4; pointer-events:none;
    background:linear-gradient(to bottom,
      rgba(57,255,20,0) 0%,
      rgba(57,255,20,.05) 45%,
      rgba(0,255,247,.08) 50%,
      rgba(57,255,20,.05) 55%,
      rgba(57,255,20,0) 100%);
    animation:scan 7.5s linear infinite;
    mix-blend-mode:screen;
  }
  @keyframes scan{
    from{ transform:translateY(-170px) }
    to  { transform:translateY(105vh) }
  }
  .vignette{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(115% 95% at 50% 45%,
      rgba(0,0,0,0) 42%,
      rgba(0,0,0,.5) 78%,
      rgba(0,0,0,.88) 100%);
  }
  /* subtle CRT flicker */
  .flicker{
    position:fixed; inset:0; z-index:5; pointer-events:none;
    background:rgba(57,255,20,.012);
    animation:flicker 3.2s steps(2,end) infinite;
  }
  @keyframes flicker{
    0%,100%{opacity:.35}
    47%{opacity:.35}
    48%{opacity:.75}
    49%{opacity:.2}
    62%{opacity:.6}
    63%{opacity:.25}
  }

  /* ============================================================
     LAYOUT
     ============================================================ */
  .wrap{
    position:relative; z-index:6;
    display:flex; flex-direction:column; align-items:center;
    gap:12px;
    padding:20px 16px 32px;
    min-height:100%;
  }

  /* ---------- header ---------- */
  header{ text-align:center; }
  h1{
    margin:0;
    font-size:clamp(1.5rem,4.4vw,2.5rem);
    font-weight:700;
    letter-spacing:.22em;
    color:#eafff4;
    text-shadow:
      0 0 10px rgba(57,255,20,.6),
      0 0 30px rgba(57,255,20,.28),
      0 0 60px rgba(0,255,247,.18);
    animation:glitch 5.5s infinite;
  }
  @keyframes glitch{
    0%,90%,100%{
      text-shadow:0 0 10px rgba(57,255,20,.6),0 0 30px rgba(57,255,20,.28),0 0 60px rgba(0,255,247,.18);
      transform:none; letter-spacing:.22em;
    }
    91%{
      text-shadow:-3px 0 var(--magenta),3px 0 var(--cyan),0 0 24px rgba(57,255,20,.5);
      transform:translateX(2px) skewX(-8deg);
    }
    93%{
      text-shadow:3px 0 var(--magenta),-3px 0 var(--cyan);
      transform:translateX(-3px) skewX(6deg);
    }
    95%{
      text-shadow:-2px 0 var(--cyan),2px 0 var(--magenta);
      transform:skewX(3deg);
    }
    97%{
      text-shadow:0 0 14px rgba(0,255,247,.75);
      transform:translateY(-1px); letter-spacing:.26em;
    }
  }
  .subtitle{
    margin:6px 0 0;
    font-size:.66rem;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:rgba(0,255,247,.65);
  }

  /* ---------- HUD stats ---------- */
  .hud{
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:8px;
    width:100%;
  }
  .stat{
    display:flex; flex-direction:column; align-items:center;
    min-width:88px;
    padding:6px 14px 7px;
    border:1px solid rgba(0,255,247,.22);
    background:linear-gradient(180deg,rgba(6,26,22,.75),rgba(3,9,12,.75));
    box-shadow:inset 0 0 18px rgba(57,255,20,.07), 0 0 14px rgba(0,255,247,.06);
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .stat .k{
    font-size:.55rem; letter-spacing:.3em; text-transform:uppercase;
    color:rgba(0,255,247,.6);
  }
  .stat .v{
    font-size:1.05rem; font-weight:700; letter-spacing:.12em;
    color:var(--green);
    text-shadow:0 0 10px rgba(57,255,20,.65);
    font-variant-numeric:tabular-nums;
  }
  .stat .v.cyan{ color:var(--cyan); text-shadow:0 0 10px rgba(0,255,247,.7) }
  .stat .v.magenta{ color:var(--magenta); text-shadow:0 0 10px rgba(255,0,224,.7) }
  .stat .v.amber{ color:var(--amber); text-shadow:0 0 10px rgba(255,176,0,.7) }

  /* ---------- stage ---------- */
  .stage{
    position:relative;
    padding:10px;
    border:1px solid rgba(57,255,20,.34);
    background:linear-gradient(180deg,rgba(6,22,18,.72),rgba(2,7,10,.9));
    box-shadow:
      0 0 0 1px rgba(0,255,247,.07) inset,
      0 0 28px rgba(57,255,20,.13),
      0 0 90px rgba(0,255,247,.06);
  }
  .stage::before,.stage::after{
    content:""; position:absolute; width:18px; height:18px;
    border:2px solid var(--cyan); pointer-events:none;
  }
  .stage::before{ top:-1px; left:-1px; border-right:0; border-bottom:0 }
  .stage::after{ bottom:-1px; right:-1px; border-left:0; border-top:0 }
  .corner{
    position:absolute; width:18px; height:18px; border:2px solid var(--magenta);
    pointer-events:none; opacity:.75;
  }
  .corner.tr{ top:-1px; right:-1px; border-left:0; border-bottom:0 }
  .corner.bl{ bottom:-1px; left:-1px; border-right:0; border-top:0 }

  #game{
    display:block;
    background:rgba(1,6,8,.72);
    box-shadow:inset 0 0 40px rgba(57,255,20,.09);
    touch-action:none;
  }

  /* ---------- overlay / panels ---------- */
  .overlay{
    position:absolute; inset:10px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    padding:18px;
    background:rgba(2,7,10,.83);
    backdrop-filter:blur(3px) saturate(1.2);
    -webkit-backdrop-filter:blur(3px) saturate(1.2);
    opacity:0; visibility:hidden;
    transition:opacity .22s ease, visibility .22s ease;
  }
  .overlay.show{ opacity:1; visibility:visible }
  .panel{ max-width:440px; animation:panelIn .28s ease both }
  @keyframes panelIn{
    from{ opacity:0; transform:translateY(8px) scale(.985) }
    to{ opacity:1; transform:none }
  }
  .panel-tag{
    font-size:.55rem; letter-spacing:.34em; text-transform:uppercase;
    color:rgba(255,0,224,.75); margin-bottom:10px;
  }
  .panel-title{
    margin:0 0 10px;
    font-size:clamp(1.1rem,3.4vw,1.6rem);
    letter-spacing:.2em;
    color:#eafff4;
    text-shadow:0 0 12px rgba(57,255,20,.6),0 0 34px rgba(0,255,247,.25);
  }
  .panel-title.bad{
    color:#ffd7e6;
    text-shadow:0 0 12px rgba(255,0,224,.8),0 0 34px rgba(255,45,85,.4);
    animation:glitch 2.6s infinite;
  }
  .panel-title.good{
    color:#e9fff2;
    text-shadow:0 0 14px rgba(57,255,20,.9),0 0 40px rgba(57,255,20,.35);
  }
  .panel-text{
    margin:0 0 16px;
    font-size:.76rem; line-height:1.7;
    color:rgba(200,255,224,.72);
  }
  .keys{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:8px; margin-bottom:18px;
    font-size:.62rem; color:rgba(200,255,224,.6);
  }
  .keys .or{ color:rgba(0,255,247,.45); letter-spacing:.1em }
  kbd{
    display:inline-block;
    padding:3px 6px; margin:0 1px;
    font-family:inherit; font-size:.62rem; letter-spacing:.08em;
    color:var(--cyan);
    border:1px solid rgba(0,255,247,.35);
    background:rgba(0,255,247,.06);
    box-shadow:0 0 10px rgba(0,255,247,.12) inset;
  }
  .btn{
    font-family:inherit;
    font-size:.78rem; letter-spacing:.22em; text-transform:uppercase;
    color:#04120c; font-weight:700;
    padding:11px 26px;
    border:1px solid rgba(57,255,20,.9);
    background:linear-gradient(180deg,#7dff8e,#25c455);
    box-shadow:0 0 22px rgba(57,255,20,.45), 0 0 60px rgba(57,255,20,.16);
    cursor:pointer;
    transition:transform .1s ease, box-shadow .15s ease, filter .15s ease;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  }
  .btn:hover{
    filter:brightness(1.14);
    box-shadow:0 0 30px rgba(57,255,20,.7),0 0 80px rgba(57,255,20,.22);
    transform:translateY(-1px);
  }
  .btn:active{ transform:translateY(1px) }
  .btn.ghost{
    color:var(--cyan);
    background:rgba(0,255,247,.05);
    border-color:rgba(0,255,247,.5);
    box-shadow:0 0 18px rgba(0,255,247,.2);
  }

  /* results grid on the game-over screen */
  .results{
    display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
    margin:0 0 16px;
  }
  .results .stat{ min-width:82px }

  .record{
    display:inline-block;
    margin:0 0 14px;
    padding:4px 12px;
    font-size:.6rem; letter-spacing:.3em; text-transform:uppercase;
    color:#12000e;
    background:linear-gradient(90deg,var(--magenta),#ff8ae8);
    box-shadow:0 0 24px rgba(255,0,224,.6);
    animation:recordPulse 1.1s ease-in-out infinite;
  }
  @keyframes recordPulse{
    0%,100%{ filter:brightness(1); transform:scale(1) }
    50%    { filter:brightness(1.35); transform:scale(1.035) }
  }

  /* ---------- footer : log + legend ---------- */
  .footer{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    width:100%; max-width:720px;
  }
  .log{
    display:flex; flex-direction:column; gap:2px;
    width:100%;
    min-height:3.9em;
    padding:8px 12px;
    font-size:.62rem; line-height:1.5;
    border:1px solid rgba(57,255,20,.16);
    background:rgba(2,10,8,.55);
    color:rgba(200,255,224,.55);
    text-align:left;
    overflow:hidden;
  }
  .log-line{ animation:lineIn .25s ease both; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  @keyframes lineIn{ from{opacity:0; transform:translateX(-6px)} to{opacity:1; transform:none} }
  .log-line.ok{ color:var(--green) }
  .log-line.warn{ color:var(--amber) }
  .log-line.bad{ color:var(--red) }
  .log-line.dim{ color:rgba(0,255,247,.6) }

  .legend{
    display:flex; flex-wrap:wrap; justify-content:center; gap:10px;
    font-size:.58rem; letter-spacing:.16em; text-transform:uppercase;
    color:rgba(200,255,224,.42);
  }
  .legend span b{ color:rgba(0,255,247,.8); font-weight:600 }

  @media (max-width:560px){
    .stat{ min-width:74px; padding:5px 10px 6px }
    .stat .v{ font-size:.92rem }
  }
  @media (prefers-reduced-motion:reduce){
    h1,.panel-title.bad,.record,.scanbar,.flicker{ animation:none !important }
  }
</style>
</head>
<body>

<!-- ---------- background: digital rain ---------- -->
<canvas id="matrix" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>
<div class="scanbar" aria-hidden="true"></div>
<div class="flicker" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <h1>SNAKE.EXE</h1>
    <p class="subtitle">// neural grid v2.7 &mdash; sector 7</p>
  </header>

  <!-- ---------- HUD ---------- -->
  <section class="hud" aria-label="telemetry">
    <div class="stat"><span class="k">Score</span><span class="v" id="hud-score">000000</span></div>
    <div class="stat"><span class="k">High</span><span class="v cyan" id="hud-high">000000</span></div>
    <div class="stat"><span class="k">Level</span><span class="v magenta" id="hud-level">01</span></div>
    <div class="stat"><span class="k">Speed</span><span class="v amber" id="hud-speed">1.00x</span></div>
    <div class="stat"><span class="k">Length</span><span class="v cyan" id="hud-len">04</span></div>
  </section>

  <!-- ---------- board ---------- -->
  <div class="stage" id="stage">
    <span class="corner tr" aria-hidden="true"></span>
    <span class="corner bl" aria-hidden="true"></span>
    <canvas id="game" width="576" height="576" aria-label="snake game board"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>

  <!-- ---------- footer ---------- -->
  <div class="footer">
    <div class="log" id="log" aria-live="polite"></div>
    <div class="legend">
      <span><b>Move</b> WASD / Arrows</span>
      <span><b>Start</b> Space</span>
      <span><b>Pause</b> P / Esc</span>
      <span><b>Mute</b> M</span>
      <span><b>Swipe</b> mobile</span>
    </div>
  </div>
</div>

<script>
(function () {
"use strict";

/* ============================================================
   0. CONFIGURATION
   ============================================================ */
const CFG = {
  cols: 24,                    // grid width  (cells)
  rows: 24,                    // grid height (cells)
  startLen: 4,                 // initial snake length
  baseInterval: 150,           // ms per step at level 1
  minInterval: 62,             // fastest allowed step
  intervalStep: 7,             // ms shaved off per level
  segPerLevel: 3,              // segments eaten per difficulty level
  scorePerFood: 10,            // base points per data packet
  bonusScore: 60,              // points for a bonus payload
  bonusTTL: 7000,              // bonus lifetime in ms
  highKey: 'snake.exe.highscore.v1',
  muteKey: 'snake.exe.muted.v1'
};

/* ============================================================
   1. DOM REFERENCES
   ============================================================ */
const $ = (id) => document.getElementById(id);
const gameCanvas = $('game');
const ctx = gameCanvas.getContext('2d');
const overlay = $('overlay');
const logEl = $('log');
const hud = {
  score: $('hud-score'),
  high:  $('hud-high'),
  level: $('hud-level'),
  speed: $('hud-speed'),
  len:   $('hud-len')
};

/* ============================================================
   2. GAME STATE
   ============================================================ */
const DIRS = {
  up:    { x: 0,  y: -1 },
  down:  { x: 0,  y: 1  },
  left:  { x: -1, y: 0  },
  right: { x: 1,  y: 0  }
};
const KEYMAP = {
  ArrowUp: 'up',    KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right'
};

let state = 'menu';           // menu | playing | paused | dead
let snake = [];               // head first: [{x,y}, ...]
let prevSnake = [];           // positions before the last step (for interpolation)
let dir = DIRS.right;         // current heading
let queue = [];               // buffered direction names (input leniency)
let food = null;              // {x,y}
let bonus = null;             // {x,y,ttl}
let particles = [];           // visual sparks
let floaters = [];            // floating score labels
let score = 0, level = 1, eaten = 0;
let high = Number(localStorage.getItem(CFG.highKey) || 0) || 0;
let tickAcc = 0, lastTime = 0, elapsed = 0;
let shake = 0, deathFlash = 0;
let cell = 24, dpr = 1;
let muted = localStorage.getItem(CFG.muteKey) === '1';

/* ============================================================
   3. TINY HELPERS
   ============================================================ */
const pad = (n, len) => String(Math.max(0, Math.floor(n))).padStart(len, '0');
const lerp = (a, b, t) => a + (b - a) * t;

/** Rounded-rect path (native roundRect when available). */
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/** Step interval for the current level (lower = faster). */
function interval() {
  return Math.max(CFG.minInterval, CFG.baseInterval - (level - 1) * CFG.intervalStep);
}

/** Terminal-style log line in the footer. */
function log(msg, cls) {
  const line = document.createElement('div');
  line.className = 'log-line ' + (cls || 'dim');
  line.textContent = '> ' + msg;
  logEl.prepend(line);
  while (logEl.children.length > 3) logEl.lastChild.remove();
}

/* ============================================================
   4. AUDIO (procedural blips -- no assets)
   ============================================================ */
let actx = null;
function ensureAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { try { actx = new AC(); } catch (e) { actx = null; } }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type, vol, delay) {
  if (muted || !actx) return;
  const t0 = actx.currentTime + (delay || 0);
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.55), t0 + dur);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(vol || 0.05, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain); gain.connect(actx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.03);
}
function toggleMute() {
  muted = !muted;
  localStorage.setItem(CFG.muteKey, muted ? '1' : '0');
  log(muted ? 'AUDIO SUBSYSTEM MUTED' : 'AUDIO SUBSYSTEM ONLINE', muted ? 'warn' : 'ok');
}

/* ============================================================
   5. EFFECTS (particles / floaters / flashes)
   ============================================================ */
function burst(cx, cy, count, color) {
  const px = (cx + 0.5) * cell, py = (cy + 0.5) * cell;
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = (0.4 + Math.random() * 2.4) * (cell / 24);
    particles.push({
      x: px, y: py,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 420 + Math.random() * 380,
      max: 800,
      size: (0.6 + Math.random() * 1.8) * (cell / 24),
      color: color
    });
  }
}
function addFloat(cx, cy, text, color) {
  floaters.push({
    x: (cx + 0.5) * cell,
    y: cy * cell,
    text: text,
    color: color || '#39ff14',
    life: 900, max: 900
  });
}
function updateEffects(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt * 0.06;
    p.y += p.vy * dt * 0.06;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= dt * 0.022;
    f.life -= dt;
    if (f.life <= 0) floaters.splice(i, 1);
  }
  shake = Math.max(0, shake - dt * 0.004);
  deathFlash = Math.max(0, deathFlash - dt * 0.0022);
}

/* ============================================================
   6. BOARD SIZING (responsive)
   ============================================================ */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);

  const maxW = Math.min(window.innerWidth - 56, 720);
  const maxH = window.innerHeight - 330;
  const size = Math.max(264, Math.min(maxW, maxH));

  cell = Math.max(9, Math.floor(size / CFG.cols));
  const px = cell * CFG.cols;

  gameCanvas.style.width = px + 'px';
  gameCanvas.style.height = px + 'px';
  gameCanvas.width = Math.round(px * dpr);
  gameCanvas.height = Math.round(px * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  resizeRain();
}

/* ============================================================
   7. MATRIX DIGITAL RAIN
   ============================================================ */
const rainCanvas = $('matrix');
const rainCtx = rainCanvas.getContext('2d');
const GLYPHS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワンヴ' +
               '0123456789ABCDEF<>/\\|=+*#%$@&';
let rCols = 0, rRows = 0, rSize = 16, rDrops = [], rSpeeds = [], rainAcc = 0;

function resizeRain() {
  rSize = window.innerWidth < 640 ? 12 : 16;
  rainCanvas.style.width = window.innerWidth + 'px';
  rainCanvas.style.height = window.innerHeight + 'px';
  rainCanvas.width = Math.round(window.innerWidth * dpr);
  rainCanvas.height = Math.round(window.innerHeight * dpr);
  rainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  rCols = Math.ceil(window.innerWidth / rSize);
  rRows = Math.ceil(window.innerHeight / rSize) + 2;
  rDrops = Array.from({ length: rCols }, () => Math.random() * rRows);
  rSpeeds = Array.from({ length: rCols }, () => 0.35 + Math.random() * 0.55);

  // paint the canvas flat so trails start clean
  rainCtx.fillStyle = '#03060a';
  rainCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);
}

function drawRain(dt) {
  const W = window.innerWidth, H = window.innerHeight;

  // fading translucent sheet -> creates the fading tail
  rainCtx.fillStyle = 'rgba(3,6,10,0.085)';
  rainCtx.fillRect(0, 0, W, H);

  rainCtx.font = rSize + 'px monospace';
  rainCtx.textBaseline = 'top';

  for (let i = 0; i < rCols; i++) {
    const y = rDrops[i] * rSize;
    const ch = GLYPHS[(Math.random() * GLYPHS.length) | 0];
    const isHead = Math.random() > 0.982;

    if (isHead) {
      // bright leading glyph with a hard glow
      rainCtx.shadowColor = 'rgba(57,255,20,.95)';
      rainCtx.shadowBlur = 9;
      rainCtx.fillStyle = '#d8ffdf';
    } else {
      rainCtx.shadowBlur = 0;
      rainCtx.fillStyle = Math.random() > 0.9
        ? 'rgba(0,255,247,.75)'
        : 'rgba(57,255,20,.58)';
    }

    rainCtx.fillText(ch, i * rSize, y);

    // recycle column once it leaves the screen
    if (y > H && Math.random() > 0.972) {
      rDrops[i] = -Math.random() * 8;
      rSpeeds[i] = 0.35 + Math.random() * 0.55;
    } else {
      rDrops[i] += rSpeeds[i] * (dt / 16.7);
    }
  }
  rainCtx.shadowBlur = 0;
}

/* ============================================================
   8. GAME SETUP / RESET
   ============================================================ */
function freeCell() {
  const occupied = new Set();
  snake.forEach(p => occupied.add(p.x + ',' + p.y));
  if (food) occupied.add(food.x + ',' + food.y);
  if (bonus) occupied.add(bonus.x + ',' + bonus.y);

  const open = [];
  for (let y = 0; y < CFG.rows; y++) {
    for (let x = 0; x < CFG.cols; x++) {
      if (!occupied.has(x + ',' + y)) open.push({ x, y });
    }
  }
  if (!open.length) return null;
  return open[(Math.random() * open.length) | 0];
}

function reset() {
  snake = [];
  const cy = Math.floor(CFG.rows / 2);
  for (let i = 0; i < CFG.startLen; i++) snake.push({ x: 3 - i, y: cy });

  prevSnake = snake.map(p => ({ x: p.x, y: p.y }));
  dir = DIRS.right;
  queue = [];
  score = 0; level = 1; eaten = 0;
  tickAcc = 0; shake = 0; deathFlash = 0;
  particles = []; floaters = [];
  bonus = null;
  food = null;
  food = freeCell() || { x: CFG.cols - 3, y: cy };
  updateHUD();
}

function startGame() {
  ensureAudio();
  reset();
  state = 'playing';
  hideOverlay();
  log('NEURAL LINK ESTABLISHED', 'ok');
  log('SCAVENGE DATA PACKETS :: AVOID BREACH', 'dim');
  beep(620, 0.07, 'square', 0.05);
  beep(980, 0.09, 'square', 0.045, 0.08);
}

function togglePause() {
  if (state === 'playing') {
    state = 'paused';
    showPaused();
    log('SYSTEM SUSPENDED', 'warn');
    beep(320, 0.1, 'sine', 0.04);
  } else if (state === 'paused') {
    state = 'playing';
    hideOverlay();
    log('RESUMING EXECUTION CYCLE', 'dim');
    beep(520, 0.08, 'sine', 0.04);
  }
}

/* ============================================================
   9. CORE STEP (one grid move)
   ============================================================ */
function step() {
  // snapshot for render interpolation
  prevSnake = snake.map(p => ({ x: p.x, y: p.y }));

  // consume one buffered direction
  if (queue.length) {
    const nd = DIRS[queue.shift()];
    if (nd && !(nd.x === -dir.x && nd.y === -dir.y)) dir = nd;
  }

  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // wall breach
  if (head.x < 0 || head.y < 0 || head.x >= CFG.cols || head.y >= CFG.rows) {
    return die('WALL BREACH DETECTED');
  }

  const eatsFood = food && head.x === food.x && head.y === food.y;
  const eatsBonus = bonus && head.x === bonus.x && head.y === bonus.y;
  const willGrow = !!eatsFood;

  // self collision -- tail cell is free unless the snake is growing
  const body = willGrow ? snake : snake.slice(0, snake.length - 1);
  if (body.some(p => p.x === head.x && p.y === head.y)) {
    return die('SELF-INTERSECTION FAULT');
  }

  snake.unshift(head);
  if (!willGrow) snake.pop();

  /* ---- data packet consumed ---- */
  if (eatsFood) {
    const gain = CFG.scorePerFood + (level - 1) * 2;
    score += gain;
    eaten++;
    burst(head.x, head.y, 16, '#39ff14');
    addFloat(head.x, head.y, '+' + gain);
    beep(880, 0.07, 'square', 0.05);

    const nextLevel = 1 + Math.floor(eaten / CFG.segPerLevel);
    if (nextLevel > level) {
      level = nextLevel;
      log('THREAT LEVEL ' + pad(level, 2) + ' :: VELOCITY UP', 'warn');
      beep(300, 0.14, 'sawtooth', 0.045);
      for (let i = 0; i < 3; i++) burst(head.x, head.y, 6, '#00fff7');
    }

    food = freeCell();
    if (!food) return die('GRID SATURATED :: PERFECT RUN');
    if (!bonus && Math.random() < 0.28) spawnBonus();
  }

  /* ---- bonus payload consumed ---- */
  if (eatsBonus) {
    score += CFG.bonusScore;
    burst(bonus.x, bonus.y, 26, '#ff00e0');
    burst(bonus.x, bonus.y, 12, '#00fff7');
    addFloat(bonus.x, bonus.y, '+' + CFG.bonusScore, '#ff00e0');
    log('ENCRYPTED PAYLOAD DECRYPTED', 'ok');
    beep(1320, 0.12, 'triangle', 0.05);
    bonus = null;
  }

  updateHUD();
}

function spawnBonus() {
  const spot = freeCell();
  if (!spot) return;
  bonus = { x: spot.x, y: spot.y, ttl: CFG.bonusTTL };
  log('ANOMALOUS PAYLOAD DETECTED', 'warn');
}

function die(reason) {
  state = 'dead';
  shake = 1;
  deathFlash = 1;
  tickAcc = 0;

  // blow the snake apart
  snake.forEach((p, i) => burst(p.x, p.y, 3, i % 3 === 0 ? '#00fff7' : '#39ff14'));
  beep(190, 0.34, 'sawtooth', 0.06);
  beep(90, 0.5, 'square', 0.045, 0.05);

  const isRecord = score > high;
  if (isRecord) {
    high = score;
    try { localStorage.setItem(CFG.highKey, String(high)); } catch (e) {}
  }
  updateHUD();
  log('CRITICAL :: ' + reason, 'bad');
  if (isRecord) log('NEW HIGH SCORE LOGGED :: ' + pad(high, 6), 'ok');

  showGameOver(reason, isRecord);
}

/* ============================================================
   10. HUD
   ============================================================ */
function updateHUD() {
  hud.score.textContent = pad(score, 6);
  hud.high.textContent = pad(Math.max(high, score), 6);
  hud.level.textContent = pad(level, 2);
  hud.speed.textContent = (CFG.baseInterval / interval()).toFixed(2) + 'x';
  hud.len.textContent = pad(snake.length, 2);
}

/* ============================================================
   11. RENDERING
   ============================================================ */
function draw(t) {
  const W = cell * CFG.cols, H = cell * CFG.rows;
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  if (shake > 0) {
    const s = shake * 7;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }

  drawGrid(W, H);
  drawFood();
  drawBonus();
  drawSnake(t);
  drawParticles();
  drawFloaters();

  ctx.restore();

  // death wash
  if (deathFlash > 0) {
    ctx.fillStyle = 'rgba(255,0,224,' + (deathFlash * 0.16).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function drawGrid(W, H) {
  ctx.lineWidth = 1;

  // fine lattice
  ctx.strokeStyle = 'rgba(57,255,20,0.07)';
  ctx.beginPath();
  for (let x = 0; x <= CFG.cols; x++) {
    const px = x * cell + 0.5;
    ctx.moveTo(px, 0); ctx.lineTo(px, H);
  }
  for (let y = 0; y <= CFG.rows; y++) {
    const py = y * cell + 0.5;
    ctx.moveTo(0, py); ctx.lineTo(W, py);
  }
  ctx.stroke();

  // major lattice every 4 cells
  ctx.strokeStyle = 'rgba(0,255,247,0.10)';
  ctx.beginPath();
  for (let x = 0; x <= CFG.cols; x += 4) {
    const px = x * cell + 0.5;
    ctx.moveTo(px, 0); ctx.lineTo(px, H);
  }
  for (let y = 0; y <= CFG.rows; y += 4) {
    const py = y * cell + 0.5;
    ctx.moveTo(0, py); ctx.lineTo(W, py);
  }
  ctx.stroke();

  // slow vertical scan glow inside the board
  const bandY = ((elapsed * 0.055) % (H + 220)) - 110;
  const g = ctx.createLinearGradient(0, bandY - 80, 0, bandY + 80);
  g.addColorStop(0,   'rgba(57,255,20,0)');
  g.addColorStop(0.5, 'rgba(57,255,20,0.055)');
  g.addColorStop(1,   'rgba(57,255,20,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, bandY - 80, W, 160);
}

function drawSnake(t) {
  const n = snake.length;
  const tailFallback = prevSnake[prevSnake.length - 1] || snake[0];

  for (let i = n - 1; i >= 0; i--) {
    // interpolate from the previous position -> smooth, fluid motion
    const a = prevSnake[i] || tailFallback;
    const b = snake[i];
    const x = lerp(a.x, b.x, t) * cell;
    const y = lerp(a.y, b.y, t) * cell;

    const f = i / Math.max(1, n - 1);          // 0 = head, 1 = tail
    const hue = 95 + 85 * f;                   // neon green -> cyan
    const light = 62 - 18 * f;
    const inset = 1.5 + 1.5 * f;
    const radius = Math.max(2, cell * 0.3 * (1 - 0.4 * f));

    ctx.save();
    if (i === 0) {
      ctx.shadowColor = 'rgba(150,255,180,.95)';
      ctx.shadowBlur = cell * 0.95;
    } else {
      ctx.shadowColor = 'hsla(' + hue.toFixed(0) + ',100%,55%,.6)';
      ctx.shadowBlur = cell * 0.4;
    }
    ctx.fillStyle = 'hsla(' + hue.toFixed(0) + ',100%,' + light.toFixed(0) + '%,' + (1 - 0.22 * f).toFixed(2) + ')';
    rr(x + inset, y + inset, cell - inset * 2, cell - inset * 2, radius);
    ctx.fill();
    ctx.restore();

    // head detailing : core glow + eyes that follow the heading
    if (i === 0) {
      const hx = x + cell / 2, hy = y + cell / 2;
      ctx.save();
      ctx.fillStyle = 'rgba(230,255,235,.85)';
      ctx.beginPath();
      ctx.arc(hx, hy, cell * 0.13, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const fx = dir.x * cell * 0.17, fy = dir.y * cell * 0.17;
      const sx = -dir.y * cell * 0.17, sy = dir.x * cell * 0.17;
      const dot = Math.max(1.3, cell * 0.075);
      ctx.fillStyle = '#02120a';
      ctx.beginPath(); ctx.arc(hx + fx + sx, hy + fy + sy, dot, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(hx + fx - sx, hy + fy - sy, dot, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawFood() {
  if (!food) return;
  const pulse = 0.5 + 0.5 * Math.sin(elapsed / 150);
  const cx = (food.x + 0.5) * cell, cy = (food.y + 0.5) * cell;
  const s = cell * (0.20 + 0.06 * pulse);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(elapsed * 0.0016);

  // outer halo
  ctx.shadowColor = 'rgba(57,255,20,.95)';
  ctx.shadowBlur = cell * (0.7 + 0.35 * pulse);
  ctx.strokeStyle = 'rgba(57,255,20,.9)';
  ctx.lineWidth = Math.max(1.2, cell * 0.055);
  ctx.beginPath();
  ctx.rect(-s, -s, s * 2, s * 2);
  ctx.stroke();

  // filled core
  ctx.fillStyle = 'rgba(200,255,210,' + (0.55 + 0.4 * pulse).toFixed(2) + ')';
  ctx.beginPath();
  ctx.rect(-s * 0.5, -s * 0.5, s, s);
  ctx.fill();
  ctx.restore();

  // cyan crosshair ticks
  ctx.save();
  ctx.strokeStyle = 'rgba(0,255,247,.65)';
  ctx.lineWidth = Math.max(1, cell * 0.04);
  const r1 = cell * 0.30, r2 = cell * 0.46;
  ctx.beginPath();
  ctx.moveTo(cx, cy - r1); ctx.lineTo(cx, cy - r2);
  ctx.moveTo(cx, cy + r1); ctx.lineTo(cx, cy + r2);
  ctx.moveTo(cx - r1, cy); ctx.lineTo(cx - r2, cy);
  ctx.moveTo(cx + r1, cy); ctx.lineTo(cx + r2, cy);
  ctx.stroke();
  ctx.restore();
}

function drawBonus() {
  if (!bonus) return;
  const frac = Math.max(0, bonus.ttl / CFG.bonusTTL);
  const blink = bonus.ttl < 2200 ? (Math.sin(elapsed / 70) > 0 ? 1 : 0.25) : 1;
  const cx = (bonus.x + 0.5) * cell, cy = (bonus.y + 0.5) * cell;
  const s = cell * 0.32;

  ctx.save();
  ctx.globalAlpha = blink;
  ctx.translate(cx, cy);
  ctx.rotate(-elapsed * 0.0022);

  // magenta diamond
  ctx.shadowColor = 'rgba(255,0,224,.95)';
  ctx.shadowBlur = cell * 0.8;
  ctx.fillStyle = 'rgba(255,0,224,.85)';
  ctx.beginPath();
  ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath();
  const i2 = s * 0.4;
  ctx.moveTo(0, -i2); ctx.lineTo(i2, 0); ctx.lineTo(0, i2); ctx.lineTo(-i2, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // countdown ring
  ctx.save();
  ctx.globalAlpha = blink;
  ctx.strokeStyle = 'rgba(0,255,247,.9)';
  ctx.lineWidth = Math.max(1.2, cell * 0.06);
  ctx.beginPath();
  ctx.arc(cx, cy, cell * 0.44, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
  ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const alpha = Math.max(0, p.life / p.max);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawFloaters() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold ' + Math.max(11, cell * 0.62) + 'px monospace';
  for (let i = 0; i < floaters.length; i++) {
    const f = floaters[i];
    ctx.globalAlpha = Math.max(0, f.life / f.max);
    ctx.fillStyle = f.color;
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 12;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

/* ============================================================
   12. OVERLAY SCREENS
   ============================================================ */
function showOverlay(html) {
  overlay.innerHTML = html;
  overlay.classList.add('show');
}
function hideOverlay() {
  overlay.classList.remove('show');
}

function showMenu() {
  showOverlay(
    '<div class="panel">' +
      '<div class="panel-tag">// sector 7 :: mainframe uplink</div>' +
      '<h2 class="panel-title">SYSTEM READY</h2>' +
      '<p class="panel-text">Neural handshake pending. Consume data packets to grow.<br>' +
      'Avoid wall breach and self-intersection. Grab magenta payloads for bonus creds.</p>' +
      '<div class="keys">' +
        '<span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>' +
        '<span class="or">or</span>' +
        '<span><kbd>&uarr;</kbd><kbd>&larr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd></span>' +
      '</div>' +
      '<button class="btn" data-act="start">Initialize &#9656;</button>' +
    '</div>'
  );
}

function showPaused() {
  showOverlay(
    '<div class="panel">' +
      '<div class="panel-tag">// execution halted</div>' +
      '<h2 class="panel-title">PAUSED</h2>' +
      '<p class="panel-text">Process suspended at level ' + pad(level, 2) +
      ' with ' + pad(snake.length, 2) + ' segments.</p>' +
      '<button class="btn" data-act="resume">Resume &#9656;</button>' +
    '</div>'
  );
}

function showGameOver(reason, isRecord) {
  showOverlay(
    '<div class="panel">' +
      '<div class="panel-tag">// ' + reason + '</div>' +
      '<h2 class="panel-title bad">SYSTEM FAILURE</h2>' +
      (isRecord ? '<div class="record">new high score</div>' : '') +
      '<div class="results">' +
        '<div class="stat"><span class="k">Score</span><span class="v">' + pad(score, 6) + '</span></div>' +
        '<div class="stat"><span class="k">High</span><span class="v cyan">' + pad(high, 6) + '</span></div>' +
        '<div class="stat"><span class="k">Level</span><span class="v magenta">' + pad(level, 2) + '</span></div>' +
        '<div class="stat"><span class="k">Length</span><span class="v amber">' + pad(snake.length, 2) + '</span></div>' +
      '</div>' +
      '<button class="btn" data-act="start">Reboot &#9656;</button>' +
    '</div>'
  );
}

// one delegated handler for every overlay button
overlay.addEventListener('click', function (e) {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  ensureAudio();
  if (btn.dataset.act === 'start') startGame();
  else if (btn.dataset.act === 'resume') togglePause();
});

/* ============================================================
   13. INPUT
   ============================================================ */
window.addEventListener('keydown', function (e) {
  const k = e.code;

  // stop the page from scrolling on arrows/space
  if (k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' ||
      k === 'ArrowRight' || k === 'Space') {
    e.preventDefault();
  }

  ensureAudio();

  if (k === 'KeyM') { toggleMute(); return; }

  if (state === 'playing' || state === 'paused') {
    if (k === 'KeyP' || k === 'Escape') { togglePause(); return; }
  }

  if (state === 'menu' || state === 'dead') {
    if (k === 'Space' || k === 'Enter') { startGame(); return; }
  } else if (state === 'paused') {
    if (k === 'Space' || k === 'Enter') { togglePause(); return; }
  }

  if (state !== 'playing') return;

  const name = KEYMAP[k];
  if (!name) return;

  const nd = DIRS[name];
  const ref = queue.length ? DIRS[queue[queue.length - 1]] : dir;

  // ignore reversals and duplicates; buffer up to 2 inputs for leniency
  if (nd.x === -ref.x && nd.y === -ref.y) return;
  if (nd.x === ref.x && nd.y === ref.y) return;
  if (queue.length < 2) queue.push(name);
});

/* --- touch / swipe support (still a desktop-first experience) --- */
let touchStart = null;
gameCanvas.addEventListener('touchstart', function (e) {
  ensureAudio();
  const t = e.changedTouches[0];
  touchStart = { x: t.clientX, y: t.clientY };
  e.preventDefault();
}, { passive: false });

gameCanvas.addEventListener('touchend', function (e) {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  touchStart = null;

  if (state === 'menu' || state === 'dead') { startGame(); e.preventDefault(); return; }
  if (state !== 'playing') return;

  if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
  const name = Math.abs(dx) > Math.abs(dy)
    ? (dx > 0 ? 'right' : 'left')
    : (dy > 0 ? 'down' : 'up');

  const nd = DIRS[name];
  const ref = queue.length ? DIRS[queue[queue.length - 1]] : dir;
  if (nd.x === -ref.x && nd.y === -ref.y) return;
  if (queue.length < 2) queue.push(name);
  e.preventDefault();
}, { passive: false });

/* ============================================================
   14. MAIN LOOP
   ============================================================ */
function frame(ts) {
  if (!lastTime) lastTime = ts;
  let dt = ts - lastTime;
  lastTime = ts;
  if (dt > 200) dt = 200;   // clamp after a tab switch
  elapsed += dt;

  const iv = interval();

  // fixed-timestep simulation, rendered with sub-step interpolation
  if (state === 'playing') {
    tickAcc += dt;
    let guard = 0;
    while (tickAcc >= iv && state === 'playing' && guard++ < 8) {
      tickAcc -= iv;
      step();
    }
  } else {
    tickAcc = Math.min(tickAcc, iv);
  }

  // bonus countdown only ticks while playing
  if (state === 'playing' && bonus) {
    bonus.ttl -= dt * (1 + (level - 1) * 0.03);
    if (bonus.ttl <= 0) {
      bonus = null;
      log('PAYLOAD EXPIRED', 'bad');
      beep(220, 0.18, 'sawtooth', 0.035);
    }
  }

  // matrix rain at ~28fps (plenty smooth, keeps the CPU cool)
  rainAcc += dt;
  if (rainAcc >= 36) {
    drawRain(rainAcc);
    rainAcc = 0;
  }

  updateEffects(dt);

  const t = (state === 'dead') ? 1 : Math.min(tickAcc / iv, 1);
  draw(t);

  requestAnimationFrame(frame);
}

/* ============================================================
   15. BOOT
   ============================================================ */
let resizeTimer = null;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 120);
});

resize();
reset();
showMenu();
log('BOOT SEQUENCE COMPLETE', 'ok');
log('AWAITING OPERATOR INPUT', 'dim');
requestAnimationFrame(frame);

})();
</script>
