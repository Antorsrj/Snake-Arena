<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEON SERPENT // CYBER://GRID</title>
<style>
  :root{
    --bg:#02080a;--panel:#05131a;--neon:#39ff14;--cyan:#00e5ff;--magenta:#ff00ea;--dim:#0a2a2a;--glow-green:0 0 8px #39ff14,0 0 20px #39ff14;--glow-cyan:0 0 8px #00e5ff,0 0 20px #00e5ff;--glow-magenta:0 0 8px #ff00ea,0 0 20px #ff00ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:#c8ffe8;font-family:'Courier New',monospace;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh}
  canvas{position:fixed;inset:0;z-index:0}
  .wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;max-width:100vw}
  .title{font-size:clamp(20px,4vw,34px);letter-spacing:4px;text-shadow:var(--glow-green);color:var(--neon);text-transform:uppercase;animation:glitch 3s infinite}
  @keyframes glitch{0%,94%{text-shadow:var(--glow-green);transform:none}95%{text-shadow:var(--glow-magenta);transform:translate(-2px,1px)}96%{text-shadow:var(--glow-cyan);transform:translate(2px,-1px)}97%{text-shadow:var(--glow-green);transform:translate(0,0)}}
  .hud{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
  .stat{background:rgba(5,19,26,.7);border:1px solid var(--cyan);padding:8px 16px;border-radius:4px;box-shadow:var(--glow-cyan);text-align:center;min-width:110px}
  .stat .label{font-size:10px;color:var(--cyan);letter-spacing:2px}
  .stat .val{font-size:22px;color:var(--neon);text-shadow:var(--glow-green)}
  .board{position:relative;border:2px solid var(--neon);box-shadow:0 0 24px #39ff1466, inset 0 0 24px #39ff1422;border-radius:6px;overflow:hidden;background:rgba(2,8,10,.6);backdrop-filter:blur(2px)}
  canvas#game{display:block}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(2,8,10,.75);backdrop-filter:blur(4px);text-align:center;padding:20px}
  .overlay h2{font-size:clamp(24px,5vw,40px);letter-spacing:6px;margin-bottom:10px;text-shadow:var(--glow-magenta);color:var(--magenta)}
  .overlay p{margin:6px 0;color:#b0ffd9;letter-spacing:1px}
  .overlay .btn{margin-top:18px;padding:10px 24px;border:1px solid var(--neon);color:var(--neon);background:transparent;font-family:inherit;letter-spacing:2px;cursor:pointer;box-shadow:var(--glow-green);transition:.2s}
  .overlay .btn:hover{background:var(--neon);color:#000}
  .controls{font-size:11px;color:#7fb;opacity:.8;letter-spacing:1px;text-align:center}
  .scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0px,rgba(255,255,255,.04) 1px,transparent 1px,transparent 3px);mix-blend-mode:overlay}
  .grid{position:fixed;inset:0;z-index:0;background:linear-gradient(transparent 97%,#39ff1410 100%),linear-gradient(90deg,transparent 97%,#00e5ff10 100%);background-size:40px 40px;opacity:.4;pointer-events:none}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="grid"></div>
<div class="scanlines"></div>
<div class="wrap">
  <div class="title">// NEON SERPENT //</div>
  <div class="hud">
    <div class="stat"><div class="label">SCORE</div><div class="val" id="score">0</div></div>
    <div class="stat"><div class="label">HIGHSCORE</div><div class="val" id="hi">0</div></div>
    <div class="stat"><div class="label">LEVEL</div><div class="val" id="lvl">1</div></div>
  </div>
  <div class="board">
    <canvas id="game" width="600" height="600"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">NEON SERPENT</h2>
      <p id="ovMsg">Eat the magenta data-cores. Don't bite yourself. Don't hit the wall.</p>
      <p style="font-size:12px;opacity:.7">Arrows / WASD to move &nbsp;•&nbsp; Space to start</p>
      <button class="btn" id="btn">INITIATE</button>
    </div>
  </div>
  <div class="controls">[↑↓←→ / W A S D] MOVE &nbsp; [SPACE] START / RESTART &nbsp; [P] PAUSE</div>
</div>

<script>
/* ============================================================
   MATRIX RAIN BACKGROUND
   ============================================================ */
const rain = document.getElementById('rain'), rctx = rain.getContext('2d');
let drops = [];
function resizeRain(){rain.width=innerWidth;rain.height=innerHeight;drops=[];const cols=Math.floor(rain.width/16);for(let i=0;i<cols;i++)drops.push({x:i*16,y:Math.random()*rain.height,speed:1+Math.random()*2,chars:[]})}
function drawRain(){rctx.fillStyle='rgba(2,8,10,0.08)';rctx.fillRect(0,0,rain.width,rain.height);rctx.font='14px Courier New';for(const d of drops){const ch=String.fromCharCode(0x30a0+Math.random()*96);rctx.fillStyle=Math.random()>.95?'#fff':'#39ff14';rctx.shadowColor='#39ff14';rctx.shadowBlur=6;rctx.fillText(ch,d.x,d.y);d.y+=d.speed*1.4;if(d.y>rain.height&&Math.random()>.97)d.y=0}}
resizeRain();addEventListener('resize',resizeRain);setInterval(drawRain,40);

/* ============================================================
   GAME
   ============================================================ */
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
const SIZE=20, COLS=canvas.width/SIZE, ROWS=canvas.height/SIZE;
let snake, dir, food, score, hi, level, speed, timer, running=false, paused=false, dead=false, particles=[];

hi=Number(localStorage.getItem('neonSnakeHi')||0);
document.getElementById('hi').textContent=hi;

function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0}; score=0; level=1; speed=140; running=true; paused=false; dead=false;
  food=spawnFood(); particles=[];
  document.getElementById('score').textContent=score;
  document.getElementById('lvl').textContent=level;
  schedule();
}
function spawnFood(){let p;do{p={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}while(snake && snake.some(s=>s.x===p.x&&s.y===p.y));return p;}
function schedule(){clearTimeout(timer);if(!running||paused||dead)return;timer=setTimeout(tick,speed)}
function tick(){
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  // wall collision
  if(head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS){gameOver();return}
  // self collision
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10*level; spawnParticles(food.x,food.y,'#ff00ea'); food=spawnFood();
    document.getElementById('score').textContent=score;
    // level up every 5 foods
    const segs=snake.length;
    const newLevel=Math.floor((segs-3)/5)+1;
    if(newLevel>level){level=newLevel;speed=Math.max(55,140-(level-1)*12);document.getElementById('lvl').textContent=level;spawnParticles(head.x,head.y,'#00e5ff')}
  }else{
    snake.pop();
  }
  updateHi(); draw(); schedule();
}
function gameOver(){dead=true;running=false;clearTimeout(timer);
  if(score>hi){hi=score;localStorage.setItem('neonSnakeHi',hi);document.getElementById('hi').textContent=hi}
  showOverlay('SYSTEM CRASH','FINAL SCORE: '+score+'  •  LEVEL '+level,'REBOOT');
  spawnExplosion(snake[0]);
  draw();
}
function updateHi(){if(score>hi){hi=score;document.getElementById('hi').textContent=hi}}

let lastDir=dir;
document.addEventListener('keydown',e=>{
  const key=e.key.toLowerCase();
  const map={arrowup:{x:0,y:-1},arrowdown:{x:0,y:1},arrowleft:{x:-1,y:0},arrowright:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
  if(key===' ') { if(!running&&!dead) reset(); else if(dead) restart(); e.preventDefault(); return;}
  if(key==='p'){ if(running){paused=!paused;showOverlay(paused?'PAUSED':'','RESUME');if(!paused)hideOverlay();schedule()} return;}
  if(map[key]){
    const nd=map[key];
    // prevent reverse
    if(nd.x===-dir.x&&nd.y===-dir.y) return;
    dir=nd; lastDir=nd; e.preventDefault();
  }
});
function restart(){dead=false;hideOverlay();reset()}

/* overlays */
function showOverlay(title,msg,btn){
  const o=document.getElementById('overlay'); o.style.display='flex';
  document.getElementById('ovTitle').textContent=title;
  document.getElementById('ovMsg').textContent=msg;
  document.getElementById('btn').textContent=btn||'OK';
}
function hideOverlay(){document.getElementById('overlay').style.display='none'}
document.getElementById('btn').addEventListener('click',()=>{if(dead||!running) restart(); else if(paused){paused=false;hideOverlay();schedule();}});

/* particles */
function spawnParticles(gx,gy,color){for(let i=0;i<14;i++){particles.push({x:gx*SIZE+SIZE/2,y:gy*SIZE+SIZE/2,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:30,color})}}
function spawnExplosion(cell){if(!cell)return;for(let i=0;i<40;i++){particles.push({x:cell.x*SIZE+SIZE/2,y:cell.y*SIZE+SIZE/2,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:45,color:Math.random()>.5?'#ff00ea':'#00e5ff'})}}
function updateParticles(){particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.life--}}

/* drawing */
let t=0;
function drawGrid(){ctx.strokeStyle='rgba(57,255,20,0.05)';ctx.lineWidth=1;for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*SIZE,0);ctx.lineTo(i*SIZE,canvas.height);ctx.stroke()}for(let i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*SIZE);ctx.lineTo(canvas.width,i*SIZE);ctx.stroke()}}
function draw(){
  ctx.fillStyle='#02080a';ctx.fillRect(0,0,canvas.width,canvas.height);
  drawGrid();
  // food
  const fx=food.x*SIZE+SIZE/2, fy=food.y*SIZE+SIZE/2; const pulse=Math.sin(t*0.1)*3;
  ctx.shadowColor='#ff00ea';ctx.shadowBlur=20;ctx.fillStyle='#ff00ea';
  ctx.beginPath();ctx.arc(fx,fy,SIZE/2-2+pulse,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(fx,fy,3,0,Math.PI*2);ctx.fill();
  // snake
  snake.forEach((s,i)=>{
    const x=s.x*SIZE,y=s.y*SIZE;
    const ratio=i/snake.length;
    const r=Math.round(57+ (0-57)*ratio); // green to darker
    const g=Math.round(255*(1-ratio*0.6));
    const b=Math.round(20+ 235*ratio);
    ctx.shadowColor=i===0?'#00e5ff':'#39ff14';ctx.shadowBlur=i===0?18:8;
    ctx.fillStyle=i===0?`rgba(0,229,255,0.95)`: `rgba(57,${g},${b},0.85)`;
    const pad=i===0?1:2; ctx.fillRect(x+pad,y+pad,SIZE-pad*2,SIZE-pad*2);
    // inner core for head
    if(i===0){ctx.fillStyle='#fff';ctx.fillRect(x+6,y+6,SIZE-12,SIZE-12)}
  });
  ctx.shadowBlur=0;
  // particles
  updateParticles();
  for(const p of particles){ctx.globalAlpha=p.life/45;ctx.shadowColor=p.color;ctx.shadowBlur=8;ctx.fillStyle=p.color;ctx.fillRect(p.x-2,p.y-2,4,4)}
  ctx.globalAlpha=1;ctx.shadowBlur=0;
  // scan glitch line occasionally
  if(Math.random()<0.02){ctx.fillStyle='rgba(255,0,234,0.08)';ctx.fillRect(0,Math.random()*canvas.height,canvas.width,2)}
  t++;
  if(running&&!dead) requestAnimationFrame(()=>{}); // keep animation for pulses handled in tick draw already
}
setInterval(()=>{if(running&&!paused&&!dead){/* pulse redraw */draw()}},60);
showOverlay("NEON SERPENT","Eat the magenta data-cores. Don't bite yourself. Don't hit the wall.","INITIATE");
document.getElementById('btn').textContent='INITIATE';
// initial empty board
snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
dir={x:1,y:0}; food={x:15,y:15}; score=0; level=1; particles=[];
draw();
</script>
</body>
</html>
