<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_SNAKE // NEURAL_LINK</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --dark-bg: #050505;
            --matrix-text: rgba(0, 255, 65, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Matrix Background Canvas */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.3;
        }

        /* Scanline Effect Overlay */
        body::after {
            content: " ";
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.06),
                rgba(0, 255, 0, 0.02),
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }

        #game-container {
            position: relative;
            width: 90vmin;
            height: 90vmin;
            max-width: 600px;
            max-height: 600px;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 15px var(--neon-cyan);
            background: rgba(0, 0, 0, 0.8);
        }

        canvas#game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }

        #hud {
            position: absolute;
            top: -40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--neon-green);
        }

        .hud-item span {
            color: var(--neon-cyan);
        }

        /* Game Over Screen */
        #overlay {
            background: rgba(0, 0, 0, 0.85);
            display: none;
            pointer-events: auto;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: var(--neon-magenta);
            text-shadow: 3px 3px 0px var(--neon-cyan);
            animation: glitch 1s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .btn {
            padding: 10px 30px;
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-family: inherit;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 10px var(--neon-green);
        }

        .btn:hover {
            background: var(--neon-green);
            color: black;
            box-shadow: 0 0 25px var(--neon-green);
        }

        .instructions {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--neon-cyan);
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div id="game-container">
        <div id="hud">
            <div class="hud-item">SCORE: <span id="score-val">0</span></div>
            <div class="hud-item">HIGH: <span id="high-score-val">0</span></div>
        </div>

        <canvas id="game-canvas"></canvas>

        <div id="overlay" class="ui-layer">
            <h1 id="status-title">SYSTEM_ERROR</h1>
            <p id="final-score" style="margin-bottom: 20px;"></p>
            <button class="btn" onclick="resetGame()">REBOOT</button>
            <div class="instructions">USE ARROWS OR WASD TO NAVIGATE</div>
        </div>
    </div>

    <script>
        /**
         * CYBER_SNAKE // CORE ENGINE
         */

        // --- CONFIGURATION ---
        const GRID_SIZE = 20;
        const CANVAS_SIZE = 600; // Base resolution
        const INITIAL_SPEED = 120; // ms per move
        const SPEED_INCREMENT = 2; // ms reduction per food

        // --- DOM ELEMENTS ---
        const gameCanvas = document.getElementById('game-canvas');
        const ctx = gameCanvas.getContext('2d');
        const matrixCanvas = document.getElementById('matrix-canvas');
        const mCtx = matrixCanvas.getContext('2d');
        const scoreEl = document.getElementById('score-val');
        const highScoreEl = document.getElementById('high-score-val');
        const overlay = document.getElementById('overlay');
        const statusTitle = document.getElementById('status-title');
        const finalScoreEl = document.getElementById('final-score');

        // --- GAME STATE ---
        let snake = [];
        let food = { x: 0, y: 0 };
        let direction = 'RIGHT';
        let nextDirection = 'RIGHT';
        let score = 0;
        let highScore = localStorage.getItem('cyberSnakeHighScore') || 0;
        let gameRunning = false;
        let gameSpeed = INITIAL_SPEED;
        let lastTime = 0;
        let moveTimer = 0;

        // Set canvas internal resolution
        gameCanvas.width = CANVAS_SIZE;
        gameCanvas.height = CANVAS_SIZE;

        // --- MATRIX RAIN EFFECT ---
        const matrixChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@&%*";
        let matrixDrops = [];
        let matrixColumns = 0;

        function initMatrix() {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
            matrixColumns = Math.floor(matrixCanvas.width / 20);
            for (let i = 0; i < matrixColumns; i++) {
                matrixDrops[i] = Math.random() * -100;
            }
        }

        function drawMatrix(time) {
            mCtx.fillStyle = 'rgba(5, 5, 5, 0.1)';
            mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            
            mCtx.fillStyle = '#00ff41';
            mCtx.font = '16px monospace';

            for (let i = 0; i < matrixDrops.length; i++) {
                const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                const x = i * 20;
                const y = matrixDrops[i] * 20;

                mCtx.fillText(text, x, y);

                if (y > matrixCanvas.height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }

        // --- SNAKE LOGIC ---

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = 'RIGHT';
            nextDirection = 'RIGHT';
            score = 0;
            gameSpeed = INITIAL_SPEED;
            scoreEl.innerText = score;
            highScoreEl.innerText = highScore;
            spawnFood();
            gameRunning = true;
            overlay.style.display = 'none';
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * (CANVAS_SIZE / GRID_SIZE)),
                y: Math.floor(Math.random() * (CANVAS_SIZE / GRID_SIZE))
            };
            // Don't spawn food on snake body
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) spawnFood();
            });
        }

        function update() {
            if (!gameRunning) return;

            direction = nextDirection;
            const head = { ...snake[0] };

            if (direction === 'UP') head.y--;
            if (direction === 'DOWN') head.y++;
            if (direction === 'LEFT') head.x--;
            if (direction === 'RIGHT') head.x++;

            // Wall Collision
            if (head.x < 0 || head.x >= CANVAS_SIZE / GRID_SIZE || 
                head.y < 0 || head.y >= CANVAS_SIZE / GRID_SIZE) {
                return gameOver();
            }

            // Self Collision
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return gameOver();
                }
            }

            snake.unshift(head);

            // Food Collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('cyberSnakeHighScore', highScore);
                    highScoreEl.innerText = highScore;
                }
                gameSpeed = Math.max(50, INITIAL_SPEED - (score / 10) * SPEED_INCREMENT);
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = 'rgba(5, 5, 5, 0.9)';
            ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

            // Draw Grid (Subtle)
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
            ctx.lineWidth = 1;
            for(let i=0; i<=CANVAS_SIZE; i+=GRID_SIZE) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, CANVAS_SIZE); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(CANVAS_SIZE, i); ctx.stroke();
            }

            // Draw Food
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff00ff';
            ctx.fillStyle = '#ff00ff';
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE/2, 
                food.y * GRID_SIZE + GRID_SIZE/2, 
                GRID_SIZE/2.5, 0, Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw Snake
            snake.forEach((part, index) => {
                const isHead = index === 0;
                ctx.shadowBlur = isHead ? 15 : 5;
                ctx.shadowColor = isHead ? '#00f3ff' : '#00ff41';
                
                // Gradient-like color for snake
                ctx.fillStyle = isHead ? '#00f3ff' : '#00ff41';
                
                // Draw part with slight padding for a "segmented" look
                ctx.fillRect(
                    part.x * GRID_SIZE + 1, 
                    part.y * GRID_SIZE + 1, 
                    GRID_SIZE - 2, 
                    GRID_SIZE - 2
                );
                
                // Add a little "glitch" detail to the head
                if (isHead) {
                    ctx.fillStyle = '#050505';
                    ctx.fillRect(part.x * GRID_SIZE + 4, part.y * GRID_SIZE + 4, 4, 4);
                }
            });
            ctx.shadowBlur = 0;
        }

        function gameOver() {
            gameRunning = false;
            statusTitle.innerText = "CONNECTION_LOST";
            finalScoreEl.innerText = `DATA_RECOVERED: ${score}`;
            overlay.style.display = 'flex';
        }

        function resetGame() {
            initGame();
        }

        // --- INPUT HANDLING ---
        window.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            
            // Arrow keys or WASD
            if ((key === 'arrowup' || key === 'w') && direction !== 'DOWN') nextDirection = 'UP';
            else if ((key === 'arrowdown' || key === 's') && direction !== 'UP') nextDirection = 'DOWN';
            else if ((key === 'arrowleft' || key === 'a') && direction !== 'RIGHT') nextDirection = 'LEFT';
            else if ((key === 'arrowright' || key === 'd') && direction !== 'LEFT') nextDirection = 'RIGHT';
        });

        // --- MAIN LOOP ---
        function gameLoop(timestamp) {
            // Matrix background runs every frame
            drawMatrix(timestamp);

            if (gameRunning) {
                const deltaTime = timestamp - lastTime;
                lastTime = timestamp;
                moveTimer += deltaTime;

                if (moveTimer >= gameSpeed) {
                    update();
                    moveTimer = 0;
                }
                draw();
            } else {
                // Still draw the board even if game is over
                draw();
            }

            requestAnimationFrame(gameLoop);
        }

        // --- INITIALIZATION ---
        window.addEventListener('resize', initMatrix);
        
        // Start everything
        initMatrix();
        highScoreEl.innerText = highScore;
        
        // Show initial overlay
        statusTitle.innerText = "NEURAL_LINK_READY";
        finalScoreEl.innerText = "AWAITING_COMMAND...";
        overlay.style.display = 'flex';

        // Kick off loop
        requestAnimationFrame(gameLoop);

        // Start the game after a short delay or on first click (simulated by reset)
        // For this standalone, we'll just wait for user to hit 'REBOOT'
        
        // Override initial reset behavior to start the actual logic
        const originalReset = resetGame;
        resetGame = () => {
            initGame();
        };

    </script>
</body>
</html>
